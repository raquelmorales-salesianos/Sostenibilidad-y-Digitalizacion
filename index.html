<style>
:root{--navy:#1B2A41;--navy2:#2c4165;--yel:#F2B705;--yel-soft:#FFF4CC;--blue-soft:#E8EEF7;--ok:#1f7a3f;--ok-soft:#e3f4e8;--bad:#b3261e;--bad-soft:#fbe7e5;
--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5b6474;--line:#dde2ea;--radius:12px;--font:"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font)}
a{color:#1f56b8}
button{font:inherit;cursor:pointer}
.top{overflow:hidden;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top img{width:34px;height:34px;border-radius:7px}
.top .ttl{font-weight:700;line-height:1.2}
.top .ttl small{display:block;font-weight:400;opacity:.8;font-size:12px}
.top .sp{flex:1}
.top .who{font-size:13px;opacity:.9;text-align:right}
.top .saved{font-size:12px;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:20px;white-space:nowrap}
.menu-btn{display:none;background:none;border:0;color:#fff;font-size:24px;padding:0 6px}
.layout{display:flex;max-width:1280px;margin:0 auto}
nav.side{width:300px;flex:0 0 300px;height:calc(100vh - 54px);position:sticky;top:54px;overflow:auto;padding:14px 10px 40px;border-right:1px solid var(--line);background:#fff}
nav.side .grp{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px;display:flex;justify-content:space-between;align-items:center}
nav.side a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:8px;font-size:14px}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--yel-soft);font-weight:600}
nav.side .num{font-variant-numeric:tabular-nums;color:var(--muted);min-width:28px;font-size:13px}
nav.side .pc{margin-left:auto;font-size:11px;color:var(--muted)}
nav.side .pc.full{color:var(--ok);font-weight:700}
.badge-mini{font-size:15px;filter:grayscale(1);opacity:.35}
.badge-mini.got{filter:none;opacity:1}
main{flex:1;min-width:0;padding:24px 28px 80px}
.page{overflow-wrap:anywhere}
.page{max-width:840px;margin:0 auto}
h1{font-size:30px;line-height:1.2;color:var(--navy);margin:6px 0 4px}
h2{font-size:21px;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--yel)}
h3{font-size:17px;color:var(--navy);margin:18px 0 8px}
.meta{color:var(--muted);font-size:14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px}
.pill.ra{background:var(--blue-soft);border-color:#c9d6ea}
.lead{background:var(--yel-soft);border-left:6px solid var(--yel);padding:14px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:12px 0 18px}
.tip{background:var(--blue-soft);border-left:6px solid var(--navy);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0}
.ses{margin:34px 0 4px;display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.ses:after{content:"";flex:1;height:2px;background:var(--line)}
table{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:14.5px;background:#fff}
th{background:var(--navy);color:#fff;text-align:left;font-weight:600}
th,td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
.tw{overflow-x:auto}
code,.code{font-family:Consolas,"Courier New",monospace;background:#eef0f4;border-radius:5px;padding:1px 5px;font-size:.92em}
.code{display:block;padding:10px 14px;margin:10px 0;color:var(--navy);font-weight:700;white-space:pre-wrap;word-break:break-word}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 10px;margin:18px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.act>.at{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;font-weight:700;color:var(--navy);font-size:17px}
.act>.at .n{background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;white-space:nowrap}
.ex{background:#f3f8f2;border:1px dashed #8bbf95;border-radius:10px;padding:10px 14px;margin:10px 0}
.ex>.et{font-weight:700;color:var(--ok);font-size:14px;margin-bottom:4px}
.q{margin:12px 0 14px}
.q label.ql{display:block;font-weight:600;margin-bottom:5px}
.q input[type=text],.q input[type=url],.q textarea,.q select,.tblq input,.tblq select,.prof input{width:100%;font:inherit;padding:8px 10px;border:1.5px solid #c5ccd8;border-radius:8px;background:#fff;color:var(--ink)}
.q textarea{min-height:90px;resize:vertical}
.q input:focus,.q textarea:focus,.tblq input:focus,.prof input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(44,65,101,.15)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.fb{font-size:14px;margin-top:5px;min-height:1px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.info{color:var(--muted)}
.q.ok input,.q.ok textarea{border-color:var(--ok);background:var(--ok-soft)}
.q.bad input{border-color:var(--bad);background:var(--bad-soft)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.yel{background:var(--yel);color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.mc .opts{display:grid;gap:6px}
.mc .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #c5ccd8;border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}
.mc .opt:hover{border-color:var(--navy2)}
.mc .opt .l{font-weight:700;color:var(--navy);min-width:18px}
.mc .opt.sel.good{border-color:var(--ok);background:var(--ok-soft)}
.mc .opt.sel.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mc .opt.show{border-color:var(--ok)}
.chk{list-style:none;padding:0;margin:8px 0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:0 0 auto}
.tblq td{padding:4px}
.tblq td.lab{background:#f7f8fa;font-weight:600;font-size:14px;padding:7px 9px;min-width:120px}
.tblq input,.tblq select{border-radius:6px;padding:6px 8px;font-size:14.5px}
.drive{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px 20px;margin:34px 0 10px}
.drive h3{color:#fff;margin:0 0 6px}
.drive .fn{font-family:Consolas,monospace;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:6px}
.drive .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.drive .btn.sec{background:transparent;color:#fff;border-color:#fff}
.prog{height:8px;background:#e3e7ee;border-radius:10px;overflow:hidden;margin:6px 0 4px}
.prog>i{display:block;height:100%;background:var(--ok);width:0}
.unitnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--ink);display:block}
.card:hover{border-color:var(--navy2)}
.card b{color:var(--navy)}
.bdg{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0}
.bdg .ic{font-size:34px;filter:grayscale(1);opacity:.35}
.bdg.got .ic{filter:none;opacity:1}
.bdg.got{border-color:var(--ok);background:var(--ok-soft)}
.bdg .t{flex:1}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}
.prof label{font-weight:600;font-size:14px}
.prof .full{grid-column:1/-1}
.cnt{font-size:12px;color:var(--muted);text-align:right}
.gridw{display:inline-grid;gap:2px;margin:8px 0;font-size:12px;user-select:none}
.gridw div{width:34px;height:24px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line)}
.gridw .hd{background:#eef0f4;font-weight:700;color:var(--muted)}
.gridw .hit{background:var(--yel);border-color:#c99700}
.meter{height:10px;border-radius:10px;background:#e3e7ee;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;transition:width .2s}
.calc{display:grid;grid-template-columns:1fr 160px;gap:6px 12px;align-items:center;max-width:560px}
.calc output{font-weight:700;color:var(--navy)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.warn{background:var(--bad-soft);border-left:6px solid var(--bad);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0}
.tree{font-family:Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;white-space:pre;overflow-x:auto;font-size:14px;line-height:1.6}
img.logo{display:block;margin:10px auto;width:130px;border-radius:14px}
@media (max-width:900px){
 .menu-btn{display:block}
 nav.side{position:fixed;left:0;top:54px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 16px rgba(0,0,0,.15);height:calc(100vh - 54px)}
 nav.side.open{transform:none}
 main{padding:18px 16px 70px}
 h1{font-size:25px}
 .top .who{display:none}
 .top .ttl small{display:none}
 .top .ttl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .top .saved{font-size:11px;padding:2px 6px}
 .top .sp{display:none}
 .prof{grid-template-columns:1fr}
}
@media print{
 .top,nav.side,.drive .btns,.unitnav,.btn{display:none!important}
 main{padding:0}
 .act{break-inside:avoid;box-shadow:none}
 body{background:#fff}
}

</style>

UNITS.push({id:"1.1",block:1,title:"Del papel a la nube: ¿qué es digitalizar?",ses:"Sesión 1",ra:"RA2 · RA5",body:`
! Digitalizar no es «tener ordenador»: es usar la tecnología para trabajar más rápido, con menos errores y llegar a más clientes. Antes de cambiar nada, hay que dibujar cómo funciona la empresa hoy.
## Aprende
Toda empresa de instalaciones eléctricas, grande o pequeña, sigue más o menos estas etapas:
| Etapa | Cómo se hace en la empresa clásica | Problema típico |
| 1. Captar clientes | Boca a boca, tarjetas, rótulo en la furgoneta | Si nadie te recomienda, no hay trabajo |
| 2. Visita y medición | Notas en papel, fotos sueltas en el móvil | Se pierden datos y medidas |
| 3. Presupuesto | A mano en una libreta, sumando con calculadora | Errores de cálculo y aspecto poco profesional |
| 4. Compra de material | Llamada al almacén | Se olvida material, viajes extra |
| 5. Instalación | Según la experiencia del oficial | Sin registro de horas reales |
| 6. Certificado y documentación | Papeles que se rellenan al final | Retrasos para dar de alta el suministro |
| 7. Factura y cobro | Factura en papel, cobro en mano | Impagos y despistes |
| 8. Postventa | El cliente llama si hay problema | No se aprovecha para conseguir más trabajo |
Un **diagrama de bloques** dibuja esas etapas como cajas unidas con flechas. Es el mapa de la empresa: sirve para ver dónde se pierde tiempo y qué se puede mejorar.
@act Ejemplo: el diagrama de un pedido de material
@ex Ejemplo resuelto
Así se dibuja con texto el proceso de pedir material al almacén en la empresa clásica:
$ Revisar el trabajo → Apuntar el material en papel → Llamar al almacén → Recoger el pedido → Guardar el albarán en la furgoneta
Problema detectado: el papel se pierde y no se sabe qué material sobró. Mejora digital: una lista compartida en el móvil que se convierte en pedido.
@/ex
?long a1 | Ahora tú: escribe con flechas (→) el proceso de **cobrar una factura** en la empresa clásica, desde que se termina la obra hasta que el dinero está en el banco.
?long a1b | ¿Qué problema ves en ese proceso y qué mejora digital propondrías?
@act Entrevista a un profesional
En parejas, entrevistad durante 5 minutos a vuestro profesor o a un familiar que trabaje en el sector.
?long a2a | ¿Cómo consigue clientes?
?long a2b | ¿Cómo hace los presupuestos y cuánto tarda en cada uno?
?long a2c | ¿Qué es lo que más tiempo le hace perder en su trabajo?
@act Dibuja el diagrama de la empresa clásica
1. Dibuja en un folio (o en Google Dibujos) las 8 etapas como cajas unidas con flechas.
2. Marca con un rayo ⚡ las tres etapas donde la tecnología ayudaría más.
3. Haz una foto y súbela a tu carpeta {{05_Plan_transformacion}} con el nombre {{Diagrama_empresa_clasica}}.
?link a3 | Pega aquí el enlace a la foto de tu diagrama en Drive
?tbl a3b | Mis tres etapas a digitalizar | Etapa;Por qué la elijo;Qué tecnología se me ocurre | Primera;Segunda;Tercera
@act Comprueba lo que has aprendido
?mc a4a | ¿Cuál de estas acciones es **digitalizar** de verdad una empresa? | Comprar un ordenador nuevo para la oficina | *Hacer los presupuestos con una plantilla que calcula sola y se envía por correo | Imprimir los presupuestos en color | =Digitalizar es cambiar la forma de trabajar para ahorrar tiempo y errores, no solo tener aparatos.
?mc a4b | ¿Para qué sirve un diagrama de bloques? | Para calcular el precio de una instalación | *Para ver de un vistazo las etapas de un proceso y dónde mejorarlo | Para dibujar el esquema eléctrico de una vivienda | =Es el mapa del proceso: cada caja es una etapa y las flechas indican el orden.
?mc a4c | ¿En qué etapa de la empresa clásica son más frecuentes los errores de cálculo? | Captar clientes | *Presupuesto | Postventa | =Sumar a mano con calculadora provoca errores: lo solucionarás en el Bloque 3.
@act Test inicial: ¿cuánto sabes de digital?
Sé sincero: repetirás este test al final del curso para ver cuánto has avanzado.
?tbl a5 | Marca tu nivel en cada tarea | Mi nivel | Crear una carpeta en Drive y compartirla;Sumar una columna en una hoja de cálculo;Crear un formulario de Google;Activar la verificación en dos pasos;Hacer una página web;Pedir algo útil a una inteligencia artificial y comprobarlo | Sí;Un poco;No
## Construye
[ ] He subido la foto de mi diagrama a {{05_Plan_transformacion}}.
[ ] He completado el test inicial.
`});

UNITS.push({id:"1.2",block:1,title:"Crea tu marca",ses:"Sesión 2",ra:"Proyecto",drive:"Sube también tu logo en PNG a {{01_Marca}}.",body:`
! Antes de hacer presupuestos y una web necesitas una empresa: un nombre, un eslogan, unos colores y un logo que aparecerán en todos tus documentos. Un cliente confía más en un presupuesto con imagen profesional que en un papel sin membrete.
## Aprende
- **Marca:** la forma en que los clientes reconocen y recuerdan tu empresa.
- **Logo:** el símbolo gráfico de la marca. Debe verse bien en pequeño y en blanco y negro (en el sello de un presupuesto o en el lateral de la furgoneta).
- **Eslogan:** una frase corta que dice qué te diferencia: rapidez, seguridad, ahorro energético...
- **Colores corporativos:** dos o tres colores que usarás siempre. Se guardan con su código hexadecimal, por ejemplo #F2B705.
Ejemplo de marca inventada (la del solucionario del profesor):
@img
*Chispazo Instalaciones Eléctricas · «Conectamos tu casa con seguridad» · Azul marino #1B2A41 y amarillo #F2B705.*
@act Analiza logos reales
Busca los logos de tres empresas eléctricas, de energía o de material eléctrico.
?tbl a1 | Análisis de logos | Empresa;Símbolo que usa;Colores;¿Se entiende en pequeño? | Logo 1;Logo 2;Logo 3
?mc a1b | ¿Qué símbolo es el más repetido en las empresas del sector? | Una casa | *Un rayo o una bombilla | Un árbol | =El rayo y la bombilla se asocian al instante con electricidad. Si los usas, busca un estilo propio.
@act Busca nombre a tu empresa
@ex Ejemplo resuelto: cómo eliminar nombres
Lluvia de ideas: Chispazo · Electro Solar Integral Andaluza · Voltio · Luz y Fuerza García · RayoFix. Se descarta «Electro Solar Integral Andaluza» porque es largo y difícil de recordar, y «Voltio» porque ya lo usan muchas empresas. Se elige **Chispazo**: corto, se pronuncia fácil y suena a electricidad.
@/ex
?long a2a | Escribe cinco nombres posibles para tu empresa
?text a2b | Nombre elegido
?long a2c | ¿Por qué lo eliges y por qué descartas los demás?
!! Comprueba en Google que no existe una empresa conocida con ese nombre. Tu empresa es inventada y no debe copiar a nadie.
@act Eslogan y colores
@ex Ejemplo resuelto
Tres eslóganes para Chispazo según lo que quieren destacar: «Conectamos tu casa con seguridad» (seguridad) · «Luz en 24 horas» (rapidez) · «Ahorra con cada vatio» (eficiencia). Se elige el primero porque la seguridad es lo que más preocupa al cliente de una vivienda.
@/ex
?tbl a3 | Mis eslóganes | Eslogan;Qué destaca | Opción 1;Opción 2;Opción 3
?text a3b | Eslogan elegido | maxw:8
?text a3c | Código del color principal (ej. #1B2A41) | re:^#?[0-9a-f]{6}$ | Escribe un código de 6 caracteres hexadecimales, como #F2B705.
?text a3d | Código del color secundario | re:^#?[0-9a-f]{6}$ | Escribe un código de 6 caracteres hexadecimales, como #F2B705.
?mc a3e | ¿Por qué conviene que el logo funcione también en blanco y negro? | Porque es más barato de diseñar | *Porque se usará en sellos, fotocopias, facturas y vinilos de un solo color | Porque los colores pasan de moda | =Un buen logo se reconoce aunque se imprima en un solo color.
@act Diseña el logo y rellena tu ficha
1. Diseña tu logo en Canva o Google Dibujos: formato cuadrado, fondo blanco o transparente.
2. Descárgalo en PNG y súbelo a {{01_Marca}}.
?link a4 | Enlace a tu logo en Drive
?tbl a4b | Ficha de empresa (datos inventados) | Mi empresa | Nombre comercial;Eslogan;CIF/NIF (inventado);Dirección;Teléfono;Email;Color principal;Color secundario
## Construye
[ ] Tengo nombre, eslogan y colores elegidos.
[ ] Mi logo está en {{01_Marca}}.
[ ] La ficha de empresa está completa.
`});

UNITS.push({id:"1.3",block:1,title:"El electricista circular",ses:"Sesión 3",ra:"RA1",body:`
! En la **economía lineal** se fabrica, se usa y se tira. En la **economía circular** los materiales se reparan, se reutilizan y se reciclan para que vuelvan a ser recursos. Un electricista genera muchos residuos en cada obra: gestionarlos bien es una obligación y una oportunidad de negocio.
## Aprende
| | Economía lineal | Economía circular |
| Etapas | Extraer → fabricar → usar → tirar | Diseñar → fabricar → usar → reparar o reutilizar → reciclar → volver a fabricar |
| Ejemplo eléctrico | La pantalla fluorescente vieja va a la basura | Va al punto limpio como RAEE: el mercurio se trata aparte y el metal se recicla |
| Impacto | Más materias primas extraídas y más residuos peligrosos | Menos residuos, ahorro de materias primas y de energía |
**Residuos típicos de una obra eléctrica:** restos de cable (el cobre se recicla y tiene valor), tubos y cajas de plástico, luminarias y tubos fluorescentes (contienen mercurio: residuo peligroso), mecanismos viejos, cuadros antiguos, embalajes de cartón, pilas y baterías.
**RAEE** son los residuos de aparatos eléctricos y electrónicos. No van al contenedor normal: se llevan a un punto limpio o a un gestor autorizado.
La economía circular se relaciona con los **Objetivos de Desarrollo Sostenible (ODS)**, sobre todo el 7 (energía asequible y no contaminante), el 12 (producción y consumo responsables) y el 13 (acción por el clima).
@act ¿Lineal o circular?
?mc a1a | Un cliente cambia sus halógenos por LED y el electricista se lleva los viejos al punto limpio. | Lineal | *Circular | =Se reduce el consumo y los residuos se recuperan.
?mc a1b | Al acabar una reforma, los restos de cable van al contenedor de basura de la calle. | *Lineal | Circular | =El cobre se pierde: lo correcto es llevarlo a un gestor de metales o al punto limpio.
?mc a1c | Se repara un cuadro sustituyendo solo el diferencial averiado en lugar de cambiarlo entero. | Lineal | *Circular | =Reparar alarga la vida útil y evita residuos.
?mc a1d | Se compra una luminaria barata que no admite cambio de lámpara y se tira cuando falla. | *Lineal | Circular | =Diseño de «usar y tirar»: es mejor elegir equipos reparables.
@act La reforma de la señora Pilar
Vais a reformar la instalación de un piso de 1985. Al terminar tenéis: 40 m de cable viejo, 6 pantallas fluorescentes, 12 mecanismos antiguos, un cuadro de fusibles, 3 cajas de cartón y 2 pilas de un detector de humo. En grupos de tres, clasificad los residuos.
?tbl a2 | Clasificación de residuos | ¿Reciclable?;¿Peligroso?;¿Dónde va? | Cable de cobre;Pantallas fluorescentes;Mecanismos antiguos;Cuadro de fusibles;Cartón;Pilas
?long a2b | Compara el modelo lineal y el circular en esta reforma: ¿qué impacto tiene cada uno en el medio ambiente y en qué ODS influye?
@act Diseña servicios circulares para tu empresa
@ex Ejemplo resuelto
**Servicio:** «Plan LED con recogida». **Qué hace:** sustituye la iluminación antigua por LED, se lleva las luminarias viejas al punto limpio y entrega al cliente un cálculo del ahorro. **ODS:** 7 y 12. **Por qué vende:** el cliente ahorra en la factura y no tiene que deshacerse de los residuos.
@/ex
?tbl a3 | Mis tres servicios circulares | Nombre del servicio;Qué hace;ODS relacionado | Servicio 1;Servicio 2;Servicio 3
@act Investiga tu punto limpio
?text a4a | ¿Cuál es el punto limpio más cercano a tu casa o al centro? (nombre y localidad)
?long a4b | ¿Qué residuos eléctricos acepta? ¿Tiene limitaciones para empresas?
> **Consejo de profesional:** añadir al presupuesto una partida de «Gestión de residuos y RAEE» demuestra que trabajas de forma responsable. Lo harás en la unidad 3.7.
## Construye
[ ] He clasificado los residuos de la reforma.
[ ] Tengo tres servicios circulares para mi empresa (aparecerán en mi web).
[ ] He descargado y subido las entregas de las unidades 1.1, 1.2 y 1.3.
`});

UNITS.push({id:"2.1",block:2,title:"La nube del electricista",ses:"Sesión 4",ra:"RA3",body:`
! La **nube** son ordenadores de otras empresas, conectados a internet, que guardan tus archivos y ejecutan programas por ti. Gracias a ella puedes hacer un presupuesto en la oficina, revisarlo en el móvil dentro de la furgoneta y enseñárselo al cliente en su casa. Tu carpeta compartida con el profesor ya es trabajo en la nube.
## Aprende: los niveles de la nube
| Nivel | Qué te da | Ejemplo cercano |
| IaaS (infraestructura) | Servidores y almacenamiento «en bruto» | Una distribuidora alquila servidores para guardar los datos de miles de contadores |
| PaaS (plataforma) | Un entorno para crear y desplegar aplicaciones | Un fabricante de cargadores de coche crea en ella su aplicación |
| SaaS (software) | Programas listos para usar desde el navegador | Google Drive, Sheets, Forms y Sites: lo que usas en este curso |
**Funciones principales:** guardar datos, compartir información, procesar datos y ejecutar aplicaciones sin instalarlas.
## Aprende: edge, fog y mist
No todo se procesa en la nube lejana. En una vivienda domotizada:
| Capa | Dónde está | Ejemplo |
| Mist | En el propio sensor o actuador | El detector de movimiento decide solo si enciende la luz del pasillo |
| Edge | En un equipo dentro de la instalación | La centralita domótica del cuadro procesa los datos de los sensores |
| Fog | En la red local o del edificio | Un controlador gestiona las zonas comunes y el garaje |
| Cloud | En centros de datos lejanos | La aplicación del móvil guarda el historial de consumo |
Procesar cerca da respuestas más rápidas y funciona aunque se caiga internet; la nube aporta almacenamiento, historial y acceso desde cualquier sitio.
@act ¿IaaS, PaaS o SaaS?
?mc a1a | Usas Google Sheets en el navegador para hacer un presupuesto. | IaaS | PaaS | *SaaS | =Es un programa listo para usar: software como servicio.
?mc a1b | Una empresa alquila servidores virtuales para guardar las lecturas de sus contadores. | *IaaS | PaaS | SaaS | =Alquila la infraestructura en bruto.
?mc a1c | Un programador crea la app de un cargador de coche eléctrico sobre una plataforma de Google o Amazon que ya le da base de datos y servidor web. | IaaS | *PaaS | SaaS | =La plataforma le da el entorno; él solo programa su aplicación.
@act ¿Mist, edge, fog o cloud?
?mc a2a | Un sensor de humedad del baño enciende el extractor por sí mismo. | *Mist | Edge | Fog | Cloud | =La decisión se toma en el propio sensor.
?mc a2b | Consultas desde el móvil el consumo de tu casa del mes pasado. | Mist | Edge | Fog | *Cloud | =El historial se guarda en servidores remotos.
?mc a2c | La centralita del cuadro apaga la climatización si se abre una ventana, aunque no haya internet. | Mist | *Edge | Fog | Cloud | =Se procesa en un equipo dentro de la instalación.
@act Organiza tu carpeta compartida
Dentro de la carpeta que compartes con el profesor crea estas subcarpetas (si aún no lo has hecho):
@tree DASP_Apellidos_Nombre/\n├── 00_Entregas_cuaderno/\n├── 01_Marca/\n├── 02_Presupuestos/\n├── 03_Fotos_trabajos/\n├── 04_Web/\n├── 05_Plan_transformacion/\n└── 99_Copias_seguridad/
?link a3 | Pega el enlace de tu carpeta compartida (Drive > clic derecho > Compartir > Copiar enlace)
?mc a3b | ¿Por qué los nombres de las carpetas empiezan por 00, 01, 02...? | Porque Drive lo exige | *Para que aparezcan siempre en el mismo orden | Para ocupar menos espacio | =Drive ordena alfabéticamente: los números fijan el orden.
@act Nombra archivos como un profesional
@ex Ejemplo resuelto
La norma es {{AAAA-MM-DD_Cliente_Tipo}}. Así se ordenan solos por fecha y se encuentran con el buscador.
| Mal | Bien |
| foto cuadro.jpg | 2026-11-24_AnaGarcia_Cuadro.jpg |
| presupuesto final FINAL2.xlsx | 2026-11-24_AnaGarcia_Presupuesto.xlsx |
@/ex
?text a4a | Renombra «fotos baño juan.jpg» (trabajo del 3 de diciembre de 2026) | re:^2026-12-03_[A-Za-zÁÉÍÓÚáéíóúñÑ]+_.+ | Usa el formato 2026-12-03_Cliente_Tipo
?text a4b | Renombra «factura de marta.pdf» (15 de enero de 2027) | re:^2027-01-15_[A-Za-zÁÉÍÓÚáéíóúñÑ]+_.+ | Usa el formato 2027-01-15_Cliente_Tipo
?text a4c | Renombra «medidas cocina pedro OK.docx» (28 de noviembre de 2026) | re:^2026-11-28_[A-Za-zÁÉÍÓÚáéíóúñÑ]+_.+ | Usa el formato 2026-11-28_Cliente_Tipo
@act Permisos: ¿lector, comentador o editor?
?mc a5a | Quieres que un cliente vea su presupuesto pero no pueda cambiar los precios. | *Lector | Comentador | Editor | =Lector solo puede ver.
?mc a5b | Tu socio tiene que actualizar los precios de la base de datos. | Lector | Comentador | *Editor | =Editor puede modificar el archivo.
?mc a5c | El profesor tiene que dejarte correcciones sin tocar tu trabajo. | Lector | *Comentador | Editor | =Comentador puede añadir comentarios pero no cambiar el contenido.
@act Ventajas y riesgos de la nube
?tbl a6 | Piensa como el dueño de una empresa de instalaciones | Ventaja;Riesgo | 1;2;3
## Construye
[ ] Mi carpeta compartida tiene las 7 subcarpetas.
[ ] Sé nombrar archivos con la norma AAAA-MM-DD_Cliente_Tipo.
[ ] He abierto Drive en el móvil y veo los mismos archivos.
`});

UNITS.push({id:"2.2",block:2,title:"Ciberseguridad para autónomos",ses:"Sesión 5",ra:"RA4",body:`
! Si un electricista pierde el acceso a su correo o a su Drive, pierde presupuestos, clientes y reputación. Y quien instala cámaras, routers o domótica es responsable de dejar seguros los equipos de sus clientes.
## Aprende: las cinco reglas
| Regla | Cómo se aplica |
| 1. Contraseñas largas y distintas | Frases de contraseña («MiFurgonetaAzulVa110kmh!») y una distinta para cada servicio. Un gestor de contraseñas las recuerda por ti. |
| 2. Verificación en dos pasos (2FA) | Además de la contraseña, un código en el móvil. Aunque te roben la contraseña, no pueden entrar. |
| 3. Copias de seguridad 3-2-1 | 3 copias, en 2 soportes distintos, 1 fuera de la oficina (por ejemplo, la nube). |
| 4. Desconfía de los mensajes con prisa | Proveedores que «cambian de cuenta bancaria», paquetes que no esperas, enlaces para «verificar tu cuenta». Comprueba siempre por otra vía. |
| 5. Actualiza y cambia lo de fábrica | Actualiza móvil y ordenador. En casa de tus clientes, cambia siempre la contraseña por defecto de routers, cámaras y centralitas. |
> **Consejo de profesional:** el [INCIBE](https://www.incibe.es) tiene una línea gratuita y confidencial de ayuda en ciberseguridad, el **017**, para particulares y empresas.
@act Medidor de contraseñas
?pwd p1 | Escribe una frase de contraseña **inventada** y mira cómo cambia el medidor
?mc a1a | ¿Cuál es la contraseña más segura? | Electricista2026 | 12345678Aa | *VoltiosEnLaCocinaDeMiAbuela!7 | =La longitud es lo que más pesa: una frase larga con algún símbolo es muy difícil de adivinar.
?mc a1b | ¿Qué es lo más peligroso? | Usar una frase de contraseña larga | *Usar la misma contraseña en el correo, Drive y la tienda online | Usar un gestor de contraseñas | =Si roban una, entran en todo.
@act ¿Phishing o no?
Lee estos mensajes inventados y decide si te fiarías.
?mc a2a | «Su proveedor de material: hemos cambiado de banco. Pague la factura de este mes a la nueva cuenta adjunta. Urgente.» | Me fío | *No me fío | =Clásico fraude del cambio de cuenta: llama al proveedor a su teléfono de siempre antes de pagar.
?mc a2b | «Paquete retenido. Pague 1,99 € de tasas en este enlace: bit.ly/...» | Me fío | *No me fío | =Enlace acortado, prisa y pago pequeño para robar los datos de la tarjeta.
?mc a2c | Un correo de Google te avisa de un inicio de sesión nuevo justo cuando acabas de entrar desde el ordenador del taller, y en tu cuenta aparece ese dispositivo. | *Me fío | No me fío | =Coincide con lo que has hecho y lo compruebas en tu cuenta sin pulsar enlaces.
?mc a2d | «Cliente nuevo: le adjunto los planos de la obra en un archivo .exe» | Me fío | *No me fío | =Los planos nunca son un .exe: es un programa que puede infectar tu ordenador.
?mc a2e | Un SMS de «tu banco» te pide confirmar tu clave en una web porque «se ha bloqueado tu cuenta». | Me fío | *No me fío | =Los bancos no piden claves por SMS. Entra siempre desde su aplicación oficial.
?long a2f | Escribe tres pistas que te ayudan a detectar un mensaje fraudulento
@act Tu plan de copias 3-2-1
@ex Ejemplo resuelto: Chispazo
Copia 1: archivos originales en el portátil de la oficina. Copia 2: disco externo que se actualiza cada viernes. Copia 3: Google Drive (fuera de la oficina, sincronizado). Si roban el portátil o se inunda la oficina, los presupuestos siguen a salvo en la nube.
@/ex
?tbl a3 | Mi plan de copias | Dónde;Cada cuánto | Copia 1;Copia 2;Copia 3
> Tus respuestas de este cuaderno también necesitan copia: en **Empieza aquí** pulsa «Guardar copia en mi Drive» y súbela a {{99_Copias_seguridad}}.
@act Seguridad en casa del cliente
?mc a4a | Acabas de instalar una cámara wifi en casa de un cliente. ¿Qué haces antes de irte? | Nada, ya funciona | *Cambiar la contraseña de fábrica, actualizar el equipo y explicar al cliente cómo cambiarla | Apuntar la contraseña en la caja de la cámara | =Las contraseñas de fábrica son públicas en internet: dejarlas es dejar la puerta abierta.
?long a4b | Redacta un mensaje corto para explicar al cliente por qué debe cambiar la contraseña de su router
@act Activa la verificación en dos pasos
1. Entra en tu cuenta de Google > *Seguridad* > *Verificación en dos pasos*.
2. Elige un método (aplicación, SMS o llave). Si la cuenta del centro no lo permite, hazlo en tu cuenta personal.
3. Revisa en *Seguridad* los dispositivos conectados y las aplicaciones con acceso.
?sel a5 | ¿Qué método has elegido? | Aplicación del móvil;SMS;Llave de seguridad;No he podido activarla
## Construye
[ ] He activado la verificación en dos pasos (o sé cómo hacerlo).
[ ] He acertado al menos 4 de los 5 mensajes de phishing.
[ ] He guardado una copia de mis respuestas en {{99_Copias_seguridad}}.
`});

UNITS.push({id:"3.1",block:3,title:"Primeros pasos en Google Sheets",ses:"Sesión 6",ra:"RA4",drive:"Tu archivo de hoja de cálculo debe estar en {{02_Presupuestos}}.",body:`
! Una hoja de cálculo es una cuadrícula enorme donde cada casilla tiene nombre, como en el juego de hundir la flota. Si sabes jugar a eso, ya sabes la mitad de esta unidad.
## Aprende
| Concepto | Qué es | Ejemplo |
| Columna | Vertical, se nombra con letras | A, B, C... |
| Fila | Horizontal, se nombra con números | 1, 2, 3... |
| Celda | Cruce de una columna y una fila | B3 = columna B, fila 3 |
| Rango | Grupo de celdas seguidas | A1:A5 = de A1 a A5 |
| Pestaña (hoja) | Cada página del archivo, abajo a la izquierda | Materiales, Presupuesto |
| Barra de fórmulas | Zona de arriba donde se ve lo que hay «dentro» de la celda | {{=B2*C2}} |
**Regla de oro:** primero la letra (columna), después el número (fila). Se dice «B3», nunca «3B».
@act Hundir la flota
?grid g1 | Escribe el nombre de la celda amarilla. Consigue 5 aciertos seguidos.
@act Rangos y celdas
@ex Ejemplo resuelto
El rango {{B2:D3}} va de B2 a D3: son 3 columnas (B, C, D) × 2 filas (2, 3) = **6 celdas**.
@/ex
?num a2a | ¿Cuántas celdas hay en el rango B2:B6? | 5
?num a2b | ¿Cuántas celdas hay en el rango A1:C4? | 12 | 0 | columnas × filas
?text a2c | ¿Qué celda está justo a la derecha de D5? | =E5
?text a2d | ¿Qué celda está justo encima de C10? | =C9
?text a2e | Escribe el rango que va de A1 a A10 | =A1:A10
?long a2f | ¿En qué se diferencia una fila de una columna?
@act Tu primer archivo en la nube
1. En tu carpeta {{02_Presupuestos}}: *Nuevo* > *Hojas de cálculo de Google*. Ponle de nombre «Presupuestos_Tu nombre».
2. Haz clic en C4 y mira el cuadro de la izquierda de la barra de fórmulas: debe poner C4.
3. Escribe tu nombre en A1, tu edad en B1 y tu localidad en C1. Pulsa Intro tras cada dato.
4. Muévete solo con el teclado: flechas, Intro (baja), Tabulador (derecha).
5. Cambia el nombre de la pestaña «Hoja 1» por «Prácticas» (doble clic). Crea otra pestaña con el + y llámala «Empresa».
?link a3 | Pega el enlace a tu hoja de cálculo
@act Teclas y menús
?mc a4a | ¿Qué tecla te mueve a la celda de la derecha? | Intro | *Tabulador | Escape | =Intro baja; Tabulador va a la derecha.
?mc a4b | ¿Qué pasa si escribes en una celda y pulsas Escape? | Se guarda | *Se cancela lo que estabas escribiendo | Se borra la columna | =Escape deshace la escritura en curso.
?mc a4c | ¿Dónde cambias el nombre de una pestaña? | En el menú Archivo | *Haciendo doble clic sobre la pestaña, abajo a la izquierda | En la barra de fórmulas | =También con clic derecho > Cambiar nombre.
## Construye
[ ] Mi archivo «Presupuestos» está en {{02_Presupuestos}} y tiene las pestañas Prácticas y Empresa.
[ ] He conseguido al menos 5 aciertos en hundir la flota.
`});

UNITS.push({id:"3.2",block:3,title:"Escribir y dar formato",ses:"Sesión 7",ra:"RA4",body:`
! En una celda puede haber texto, números o fórmulas; el formato solo cambia cómo se ven, no lo que valen. Un 21% y un 0,21 son el mismo número con distinta ropa.
## Aprende
| Qué quieres hacer | Dónde está |
| Negrita, color de letra y de fondo | Barra de herramientas (B, A, bote de pintura) |
| Formato de euros | *Formato > Número > Moneda* |
| Porcentaje | Botón % de la barra |
| Quitar o poner decimales | Botones .0 y .00 |
| Ajustar el ancho de columna | Doble clic en la línea entre dos letras de columna |
| Unir celdas | Botón *Combinar celdas* |
| Bordes | Botón de bordes |
| Insertar imagen en la celda | *Insertar > Imagen > Imagen en la celda* |
**Ojo:** el texto se alinea a la izquierda y los números a la derecha. Si un número sale a la izquierda, Sheets lo ha leído como texto (por ejemplo, porque escribiste 12.5 con punto en vez de 12,5).
@act Tabla de precios con formato
En la pestaña Prácticas:
1. Escribe en A3:A6: Cable 2,5 mm², Enchufe schuko, Interruptor, Caja de registro.
2. Escribe en B3:B6 sus precios: 0,85 · 3,20 · 2,90 · 1,75. Ponles formato de moneda (€).
3. Títulos «Material» en A2 y «Precio» en B2, en negrita y con fondo de tu color corporativo.
4. Ajusta el ancho de la columna A y añade bordes a A2:B6.
[ ] Mi tabla de precios tiene formato de euros, títulos en color y bordes.
@act Porcentajes: el mismo número con distinta ropa
@ex Ejemplo resuelto
Escribes 0,21 y pulsas el botón % → aparece **21%**. Escribes 0,05 → **5%**. El valor real no cambia: solo se multiplica por 100 para mostrarlo.
@/ex
?text a2a | Escribe 0,1 y ponle formato %. ¿Qué aparece? | =10%§10 %
?text a2b | ¿Y si escribes 1,5? | =150%§150 %
?text a2c | Si quieres que aparezca 4%, ¿qué número escribes antes de pulsar %? | =0,04§0.04
@act ¿Texto o número?
?mc a3a | Escribes 12.5 (con punto) en Sheets configurado en España. | *Lo toma como texto | Lo toma como número | =En España el decimal es la coma: 12,5.
?mc a3b | Escribes «3 euros». | *Texto | Número | =Por la palabra «euros». Escribe 3 y ponle formato de moneda.
?mc a3c | Escribes 1.250,75 | Texto | *Número | =Punto de miles y coma decimal: formato español correcto.
@act Tu ficha de empresa en la hoja
Pasa la ficha de la unidad 1.2 a la pestaña Empresa con esta distribución:
| Celda | Contenido |
| A1 | Logo (imagen en la celda) |
| A3:A9 | Etiquetas: Nombre, Eslogan, CIF, Dirección, Teléfono, Email, IVA |
| B3:B8 | Tus datos |
| B9 | 21% (formato porcentaje) |
[ ] El logo se ve en A1 y las etiquetas tienen mi color corporativo.
[ ] B9 muestra 21%. La usaré en el presupuesto para calcular el IVA.
@act Reto de diseño
Copia este cartel de precios en una pestaña nueva llamada «Tarifas» y hazlo lo más profesional posible: título combinado, colores corporativos, euros y bordes.
| Servicio | Precio |
| Revisión de instalación | 45 |
| Cambio de mecanismo | 18 |
| Hora de oficial | 25 |
?long a5 | Explica en dos líneas qué has hecho para que quede profesional
## Construye
[ ] La pestaña Empresa está terminada con logo y datos.
`});

UNITS.push({id:"3.3",block:3,title:"Fórmulas básicas: sumar, multiplicar y porcentajes",ses:"Sesiones 8 y 9",ra:"RA4",body:`
! Una fórmula es una orden de cálculo que siempre empieza por =. Si cambias un número, el resultado se recalcula solo: esa es la magia que usarás en el presupuesto.
## Aprende
| Operación | Símbolo | Ejemplo | Se lee |
| Sumar | + | {{=B3+B4}} | B3 más B4 |
| Restar | - | {{=B3-B4}} | B3 menos B4 |
| Multiplicar | * | {{=B3*C3}} | B3 por C3 |
| Dividir | / | {{=B3/2}} | B3 entre 2 |
| Sumar muchas celdas | SUMA | {{=SUMA(D3:D10)}} | de D3 a D10 |
| Porcentaje | * y % | {{=D11*21%}} | el 21% de D11 |
1. Siempre empieza por =. Sin el igual, Sheets lo toma como texto.
2. Usa nombres de celda, no los números: {{=B3*C3}} se actualiza si cambias el precio; {{=0,85*50}} no.
3. Para ver la fórmula, haz clic en la celda y mira la barra de fórmulas.
@ses Sesión 1
@act Ejemplo: tres enchufes
@ex Ejemplo resuelto
En B2 está el precio (4,80 €) y en C2 la cantidad (3). En D2 escribes {{=B2*C2}} y aparece **14,40 €**. Si el precio sube a 5,10 €, D2 cambia solo a 15,30 €.
@/ex
?text a1 | Escribe la fórmula que suma las celdas de B3 a B10 | f:=SUMA(B3:B10)
?text a1b | Escribe la fórmula que multiplica el precio de E5 por la cantidad de D5 | f:=E5*D5§=D5*E5
@act Importes y total
Continúa la tabla de la unidad 3.2: en C2 escribe «Cantidad» y en D2 «Importe». Cantidades en C3:C6: 50 · 8 · 6 · 4. En D3 escribe {{=B3*C3}} y escribe a mano las de D4, D5 y D6. En C7 escribe «Total» y en D7 {{=SUMA(D3:D6)}}.
?num a2a | ¿Cuánto vale D3? | 42.5
?num a2b | ¿Cuánto vale D4? | 25.6
?num a2c | ¿Cuánto vale D5? | 17.4
?num a2d | ¿Cuánto vale D6? | 7
?num a2e | ¿Cuánto vale el total D7? | 92.5
?long a2f | Cambia el precio del enchufe a 3,50. ¿Qué celdas han cambiado solas? (Después vuelve a dejarlo en 3,20.)
@ses Sesión 2
@act Porcentajes: IVA y descuento
En C9 escribe «IVA» y en D9 {{=D7*21%}}. En C10 «Total con IVA» y en D10 {{=D7+D9}}. En C11 «Descuento 10%» y calcúlalo en D11.
?num a3a | IVA (D9), redondeado a céntimos | 19.43 | 0.006
?num a3b | Total con IVA (D10) | 111.93 | 0.006
?num a3c | Descuento del 10% (D11) | 9.25
@act Problemas del electricista
Resuélvelos en tu hoja con fórmulas y escribe aquí el resultado.
?num a4a | Compras 25 m de cable a 0,70 €/m. ¿Cuánto pagas? | 17.5
?num a4b | Instalas 6 downlights a 12 € cada uno. ¿Cuánto es con el 21% de IVA? | 87.12 | 0.006 | primero el importe, después súmale su 21%
?num a4c | Una reparación cuesta 200 €. Haces un 10% de descuento y después añades el 21% de IVA. ¿Cuánto paga el cliente? | 217.8 | 0.006 | 200 menos el 10% = 180; después el IVA
?num a4d | Un rollo de 100 m de cable cuesta 63 €. ¿Cuánto cuesta cada metro? | 0.63
@act Errores frecuentes
?mc a5a | En la celda aparece escrito «B3*C3» en lugar del resultado. | *Falta el = al principio | La columna es estrecha | Hay texto en la celda | =Sin el signo =, Sheets cree que es texto.
?mc a5b | En la celda aparece #####. | Falta el = | *La columna es demasiado estrecha | La fórmula está mal | =Ensancha la columna con doble clic en el borde.
?mc a5c | Aparece #¡VALOR! al multiplicar. | *Una de las celdas tiene texto en vez de número | Falta un paréntesis | La columna es estrecha | =Revisa que los números lleven coma decimal y no palabras.
@act Reto: tu mini factura
Crea una pestaña «Mini factura» con 3 materiales a tu elección: cantidad, precio, importe por fórmula, subtotal, IVA y total.
[ ] Mi mini factura calcula todo con fórmulas.
## Construye
[ ] Importes, total, IVA y total con IVA de la tabla de prácticas coinciden con las soluciones.
`});

UNITS.push({id:"3.4",block:3,title:"Copiar fórmulas: referencias relativas y absolutas",ses:"Sesión 10",ra:"RA4",body:`
! No hace falta escribir la misma fórmula 30 veces: se escribe una y se arrastra. El símbolo $ sirve para «clavar» una celda que no debe moverse al copiar, como el porcentaje de IVA.
## Aprende
**Arrastrar:** selecciona la celda con la fórmula y arrastra el cuadradito azul de la esquina inferior derecha (o haz doble clic en él).
| Tipo | Cómo se escribe | Al copiar hacia abajo |
| Relativa | {{B3}} | Cambia a B4, B5, B6... |
| Absoluta | {{$B$3}} | Se queda siempre en B3 |
| Mixta | {{B$3}} o {{$B3}} | Solo se clava la fila o solo la columna |
**Atajo:** pon el cursor sobre la referencia y pulsa F4: {{B3}} → {{$B$3}} → {{B$3}} → {{$B3}}.
**Otra pestaña:** {{=Empresa!B9}} trae la celda B9 de la pestaña Empresa. Si el nombre tiene espacios, va entre comillas simples: {{='Análisis interno'!I13}}.
@act Adivina la fórmula copiada
@ex Ejemplo resuelto
En D3 está {{=B3*C3}}. Al arrastrarla a D4, la fila sube 1: queda {{=B4*C4}}. A D6: {{=B6*C6}}.
@/ex
?mc a1a | Copias {{=D3*H1}} de F3 a F5. ¿Qué queda en F5? | =D3*H1 | *=D5*H3 | =D5*H1 | =Las dos referencias son relativas: ambas bajan 2 filas. ¡Por eso falla el IVA!
?mc a1b | Copias {{=D3*$H$1}} de F3 a F5. ¿Qué queda? | =D5*$H$3 | *=D5*$H$1 | =D3*$H$1 | =D3 es relativa y baja; $H$1 está clavada.
?mc a1c | Copias {{=B$3}} dos filas hacia abajo. ¿Qué queda? | =B5 | *=B$3 | =B$5 | =El $ delante del 3 clava la fila.
?mc a1d | Copias {{=$B3}} dos filas hacia abajo. ¿Qué queda? | *=$B5 | =$B3 | =B5 | =Solo la columna está clavada; la fila cambia.
@act Practica en tu hoja
1. Borra las fórmulas D4:D6. Deja solo D3 y arrástrala hasta D6.
2. En F2 escribe «IVA por línea», en G1 «IVA:» y en H1 21%.
3. En F3 escribe {{=D3*H1}} y arrástrala hasta F6. Mira lo que pasa.
4. Corrígela: {{=D3*$H$1}} y vuelve a arrastrar.
?num a2a | ¿Cuánto vale F4 cuando la fórmula está bien? | 5.38 | 0.006
?long a2b | ¿Qué salía en F4, F5 y F6 con la fórmula sin $? ¿Por qué?
?num a2c | Cambia H1 a 10%. ¿Cuánto vale ahora F3? | 4.25
@act Trae datos de otra pestaña
?text a3a | Escribe la fórmula que trae el nombre de tu empresa (celda B3 de la pestaña Empresa) | f:=Empresa!B3
?text a3b | Escribe la fórmula que multiplica D3 por el IVA de la pestaña Empresa (B9), preparada para arrastrar | f:=D3*Empresa!$B$9§=Empresa!$B$9*D3
?long a3c | ¿Por qué es mejor tener el IVA en una sola celda que escribir 21% dentro de cada fórmula?
## Construye
[ ] Sé arrastrar fórmulas y uso $ cuando hace falta.
[ ] He traído un dato de la pestaña Empresa con {{=Empresa!B9}}.
`});

UNITS.push({id:"3.5",block:3,title:"La base de datos y la mano de obra repartida",ses:"Sesiones 11 y 12",ra:"RA4",body:`
! La base de datos es el «almacén» del que el presupuesto saca los precios. Cada producto guarda su precio de coste y un porcentaje de mano de obra; con los dos, la hoja calcula el precio de venta instalado que verá el cliente.
## Aprende: una buena base de datos
1. Una fila de títulos en la fila 1, y nada más encima.
2. Una fila por producto, sin filas vacías en medio.
3. Una columna por dato: no mezcles precio y unidad en la misma celda.
4. Un **código único** por producto en la primera columna.
5. Los precios como número con formato €, nunca como texto («3 euros»).
## Aprende: la mano de obra repartida
Un electricista no cobra solo el material: cobra también el tiempo de instalarlo. Hay dos formas de presentarlo:
| | Mano de obra aparte | Mano de obra repartida (la que usaremos) |
| Cómo se ve | Materiales a coste + una línea «Mano de obra: 8 h × 25 €» | Cada partida con su precio de «suministro e instalación» |
| Qué percibe el cliente | Una cifra grande de horas que suele asustar | Precios por unidad instalada, fáciles de comparar |
| Uso profesional | Reparaciones y trabajos por horas | Lo habitual en obra y reformas |
$ Precio venta instalado = Precio coste × (1 + % mano de obra)
Cuanto más barato y más laborioso es el material, mayor es su %: un enchufe cuesta poco pero lleva tiempo colocarlo; un diferencial cuesta más y se monta rápido.
| Familia | % orientativo |
| Cables | 80 - 120% |
| Canalización (tubo) | 150% |
| Cajas | 200% |
| Mecanismos | 150 - 200% |
| Protecciones | 50 - 80% |
| Iluminación | 70 - 80% |
**Transparencia:** el precio no esconde nada porque la descripción lo dice: *suministro e instalación*. Lo que no se hace es mostrar las horas por separado.
@ses Sesión 1
@act Detective de bases de datos
Esta base de datos tiene 5 errores. Encuéntralos.
| Fila | A | B | C |
| 1 | | | |
| 2 | | | |
| 3 | Código | Descripción | Precio |
| 4 | MEC01 | Interruptor simple | 4,50 € |
| 5 | MEC01 | Conmutador | 5,20 € |
| 6 | | | |
| 7 | CAB02 | Cable 2,5 mm² | 0,70 €/m |
| 8 | PRO02 | Magnetotérmico 16 A | 9 euros y medio |
?tbl a1 | Errores encontrados | Error;Cómo lo arreglas | 1;2;3;4;5
@act Calcula precios instalados
@ex Ejemplo resuelto
Base de enchufe: coste 4,80 €, mano de obra 200% → 4,80 × (1 + 2) = 4,80 × 3 = **14,40 €** instalada.
@/ex
?num a2a | Cable 2,5 mm²: coste 0,70 €/m, 120% | 1.54
?num a2b | Diferencial: coste 28,00 €, 60% | 44.8
?num a2c | Downlight LED: coste 12,00 €, 80% | 21.6
?num a2d | Tubo corrugado 20 mm: coste 0,35 €/m, 150% (redondea a céntimos) | 0.88 | 0.006 | 0,35 × 2,5 = 0,875
?num a2e | Cuadro de 12 módulos: coste 18,00 €, 150% | 45
?mc a2f | ¿Por qué una caja de mecanismo lleva 200% y un diferencial solo 60%? | Porque la caja es más bonita | *Porque la caja cuesta muy poco y empotrarla lleva mucho tiempo, y el diferencial es caro y se monta rápido | Porque lo dice el REBT | =El % reparte el tiempo de trabajo según lo que cuesta instalar cada cosa.
@ses Sesión 2
@act Construye la pestaña Materiales
Columnas: A Código · B Descripción · C Familia · D Unidad · E Coste (€) · F % MO · G Venta instalado (€). En G2: {{=REDONDEAR(E2*(1+F2);2)}} y arrástrala.
| Código | Descripción | Familia | Unidad | Coste | % MO |
| CAB01 | Cable H07V-K 1,5 mm² | Cables | m | 0,45 | 120% |
| CAB02 | Cable H07V-K 2,5 mm² | Cables | m | 0,70 | 120% |
| TUB01 | Tubo corrugado 20 mm | Canalización | m | 0,35 | 150% |
| CAJ02 | Caja de mecanismo universal | Cajas | ud | 0,40 | 200% |
| MEC01 | Interruptor simple | Mecanismos | ud | 4,50 | 200% |
| MEC03 | Base de enchufe schuko | Mecanismos | ud | 4,80 | 200% |
| PRO02 | Magnetotérmico 2P 16 A | Protecciones | ud | 9,50 | 80% |
| PRO04 | Diferencial 2P 40 A 30 mA | Protecciones | ud | 28,00 | 60% |
| ILU01 | Downlight LED 18 W | Iluminación | ud | 12,00 | 80% |
?text a3a | Escribe la fórmula de G2 | f:=REDONDEAR(E2*(1+F2);2)§=REDONDEAR(E2*(1+F2),2)
@act Busca precios reales
Añade al menos 15 materiales más con precios de la web de un almacén de material eléctrico. Apunta aquí tres de ellos.
?tbl a4 | Tres materiales que he añadido | Código;Descripción;Proveedor;Coste (€);% MO | 1;2;3
?num a4b | ¿Cuántos productos tienes? Calcúlalo con {{=CONTARA(Materiales!A2:A100)}}
@act Debate: ¿aparte o repartida?
?long a5 | Un cliente compara dos presupuestos del mismo trabajo: uno con «Mano de obra: 12 h × 25 € = 300 €» y otro con precios instalados. Los dos suman lo mismo. ¿Cuál crees que acepta y por qué?
## Construye
[ ] La pestaña Materiales tiene fila 1 en color e inmovilizada (*Ver > Inmovilizar > 1 fila*).
[ ] Tengo al menos 24 productos con su % y su precio de venta calculado.
[ ] Sé filtrar por familia (*Datos > Crear un filtro*).
`});

UNITS.push({id:"3.6",block:3,title:"Desplegables y BUSCARV",ses:"Sesión 13",ra:"RA4",body:`
! El presupuesto empieza a trabajar solo: eliges un código en un desplegable y la descripción, la unidad y el precio instalado aparecen sin escribirlos. Como pedir en el mostrador del almacén por código de artículo.
## Aprende
**BUSCARV** busca un valor en la primera columna de una tabla y devuelve el dato de la columna que le pidas, en esa misma fila.
$ =BUSCARV(qué busco; dónde busco; nº de columna; FALSO)
| Parte | En nuestro caso | Explicación |
| Qué busco | {{A13}} | El código elegido en el presupuesto |
| Dónde busco | {{Materiales!$A$2:$G$100}} | La base de datos, con $ para que no se mueva |
| Nº de columna | 2, 4 o 7 | 2 = Descripción, 4 = Unidad, 7 = Precio venta instalado |
| FALSO | {{FALSO}} | Busca el código exacto |
**Importante:** en el presupuesto se usa la columna 7 (venta), nunca la 5 (coste). El cliente no debe ver tu precio de coste.
Si A13 está vacía, BUSCARV da error #N/A. Se evita con SI:
$ =SI(A13="";"";BUSCARV(A13;Materiales!$A$2:$G$100;2;FALSO))
@act BUSCARV sin ordenador
@ex Ejemplo resuelto
{{=BUSCARV("MEC03";Materiales!$A$2:$G$100;7;FALSO)}}: busca MEC03 en la columna A, se queda en esa fila y devuelve la columna 7 → **14,40 €**.
@/ex
Usa la tabla de la unidad 3.5 (columna 7 = venta instalado).
?text a1a | {{=BUSCARV("PRO02";...;2;FALSO)}} devuelve: | =Magnetotérmico 2P 16 A§Magnetotermico 2P 16 A
?num a1b | {{=BUSCARV("ILU01";...;7;FALSO)}} devuelve: | 21.6
?text a1c | {{=BUSCARV("CAB02";...;4;FALSO)}} devuelve: | =m
?mc a1d | {{=BUSCARV("XYZ";...;2;FALSO)}} devuelve: | 0 | Una celda vacía | *#N/A | =El código no existe en la base de datos.
?mc a1e | ¿Qué pasa si pones VERDADERO en lugar de FALSO? | Nada | *Puede devolver un producto parecido que no es el que buscas | Da error siempre | =Con VERDADERO busca un valor aproximado: muy peligroso en un presupuesto.
@act Practica en tu hoja
1. En J1:M1 de Prácticas escribe Código, Descripción, Unidad, Precio venta. En J2 escribe CAB02.
2. En K2: {{=BUSCARV(J2;Materiales!$A$2:$G$100;2;FALSO)}}. En L2 la columna 4 y en M2 la columna 7.
3. Cambia J2 por MEC03 y después por XYZ.
?num a2a | ¿Qué precio sale en M2 con CAB02? | 1.54
?long a2b | ¿Qué error aparece con XYZ y por qué?
@act Crea la pestaña Presupuesto
| Filas | Contenido |
| 1 a 4 | Logo en A1; en B1:B4 datos de la empresa con {{=Empresa!B3}}, {{=Empresa!B4}}... |
| 6 a 10 | Nº de presupuesto, fecha, cliente, dirección de la obra y validez |
| 12 | Títulos: Código · Descripción (suministro e instalación) · Unidad · Cantidad · Precio unitario · Importe |
| 13 a 32 | 20 líneas de presupuesto |
| 34 a 36 | Subtotal, IVA y Total (unidad 3.7) |
1. **Desplegable:** selecciona A13:A32 > *Datos > Validación de datos > Añadir regla* > *Menú desplegable (de un intervalo)*: {{=Materiales!$A$2:$A$100}}.
2. **Descripción** en B13, **Unidad** en C13 y **Precio unitario** en E13 con BUSCARV y SI. Arrástralas hasta la fila 32.
?text a3a | Escribe la fórmula de B13 | f:=SI(A13="";"";BUSCARV(A13;Materiales!$A$2:$G$100;2;FALSO))
?text a3b | Escribe la fórmula de E13 | f:=SI(A13="";"";BUSCARV(A13;Materiales!$A$2:$G$100;7;FALSO))
## Construye
[ ] Al elegir un código aparecen solos la descripción, la unidad y el precio.
[ ] Las filas sin código se ven vacías, sin errores.
`});

UNITS.push({id:"3.7",block:3,title:"El presupuesto final: IVA y total automáticos",ses:"Sesiones 14 y 15",ra:"RA4",drive:"Sube también el PDF del presupuesto del dormitorio a {{02_Presupuestos}}.",body:`
! Con cinco fórmulas más el presupuesto queda terminado. A partir de aquí, hacer un presupuesto nuevo es elegir códigos y escribir cantidades.
## Aprende
| Celda | Qué calcula | Fórmula |
| F13 (arrastrar a F32) | Importe de la línea | {{=SI(A13="";"";D13*E13)}} |
| F34 | Subtotal (base imponible) | {{=SUMA(F13:F32)}} |
| F35 | IVA | {{=REDONDEAR(F34*Empresa!$B$9;2)}} |
| F36 | Total | {{=F34+F35}} |
**¿Por qué REDONDEAR?** El 21% de 172,90 € es 36,309 €, pero no existen los milésimos de euro. REDONDEAR(...;2) lo deja en 36,31 €.
**Base imponible:** el importe antes de impuestos. El IVA siempre se calcula sobre ella.
@ses Sesión 1
@act Termina las fórmulas
1. F13 y arrástrala hasta F32. Subtotal, IVA y Total en F34:F36.
2. Formato € en la columna F; Total en negrita y con tu color corporativo.
3. Debajo, condiciones (precios con suministro e instalación, forma de pago, validez, plazo) y espacio para la firma del cliente.
?text a1 | Escribe la fórmula de F35 | f:=REDONDEAR(F34*Empresa!$B$9;2)§=REDONDEAR(Empresa!$B$9*F34;2)
@act Caso de prueba: el dormitorio
| Código | Cantidad |
| CAB02 | 30 |
| TUB01 | 25 |
| CAJ02 | 4 |
| MEC03 | 3 |
| MEC01 | 1 |
| ILU01 | 2 |
?num a2a | Subtotal | 172.9
?num a2b | IVA (21%) | 36.31
?num a2c | Total | 209.21
?mc a2d | ¿Hay alguna línea de «mano de obra» en el presupuesto? | Sí, al final | *No: va incluida en cada precio unitario | Solo si el cliente la pide | =Es la mano de obra repartida de la unidad 3.5.
@ses Sesión 2
@act Nuevo caso: la cocina de Carmen
Duplica la pestaña Presupuesto (clic derecho > *Duplicar*), llámala «P-002 Cocina» y haz este presupuesto:
| Código | Cantidad |
| MEC03 | 6 |
| CAJ02 | 8 |
| CAB02 | 45 |
| TUB01 | 40 |
| ILU01 | 2 |
| MEC01 | 2 |
?num a3a | Subtotal | 270.7
?num a3b | IVA (21%) | 56.85
?num a3c | Total | 327.55
@act ¿Y si cambia el IVA?
?num a4a | En el presupuesto del dormitorio, cambia el IVA de la pestaña Empresa a 10%. ¿Cuánto es el total? | 190.19
?mc a4b | ¿Cuántas fórmulas has tenido que cambiar? | Todas las del IVA | *Ninguna: solo la celda B9 de Empresa | Una por línea | =Para eso sirve tener el IVA en una sola celda. Vuelve a dejarlo en 21%.
@act Entrega el presupuesto al cliente
1. *Archivo > Descargar > PDF*. Ajusta a 1 página de ancho y quita las líneas de cuadrícula.
2. Guarda el PDF del dormitorio en {{02_Presupuestos}} con el nombre {{AAAA-MM-DD_Cliente_Presupuesto}}.
?link a5 | Enlace al PDF del presupuesto en Drive
@act Retos de ampliación
[ ] **IVA variable:** una celda con desplegable 21% / 10% que use el presupuesto.
[ ] **Residuos:** añade RES01 «Gestión de residuos de obra y RAEE», familia Servicios, coste 6,00 €, 100% → 12,00 €.
[ ] **Numeración:** cada presupuesto en su pestaña: P-2026-001, P-2026-002...
## Construye
[ ] El caso del dormitorio cuadra al céntimo: 172,90 · 36,31 · 209,21.
[ ] El PDF del presupuesto está en {{02_Presupuestos}}.
`});

UNITS.push({id:"3.8",block:3,title:"¿Cubren mis porcentajes la mano de obra?",ses:"Sesión 16",ra:"RA4",body:`
! Repartir la mano de obra tiene un riesgo: si los % son bajos, trabajas gratis sin darte cuenta. Vas a crear una hoja privada que compara lo que cobras de mano de obra dentro de los precios con lo que cuestan las horas reales.
## Aprende
$ Mano de obra incluida = Venta total − Coste total
$ Mano de obra necesaria = horas oficial × 25 € + horas ayudante × 18 € + desplazamientos × 20 €
Si la incluida es **mayor o igual** que la necesaria, tus % están bien. Si es menor, hay que subir algún % o revisar las horas.
@act Ejemplo: el dormitorio
@ex Ejemplo resuelto
| Concepto | Valor |
| Coste del material | 74,25 € |
| Venta (subtotal) | 172,90 € |
| MO incluida en los precios | 98,65 € |
| Previsión: 3 h de oficial + 1 desplazamiento | 75 + 20 = 95,00 € |
| Diferencia | +3,65 € → los % cubren la mano de obra |
@/ex
?num a1a | ¿Cuánta mano de obra va incluida en los 3 enchufes (venta 43,20 €, coste 14,40 €)? | 28.8
?num a1b | % medio de mano de obra sobre el material: 98,65 / 74,25 (escríbelo en %, sin decimales) | 133 | 1
@act ¿Y si se complica la obra?
?num a2a | Si el dormitorio lleva 4 h de oficial y 1 desplazamiento, ¿cuánta mano de obra necesitas? | 120
?num a2b | ¿Cuál es la diferencia (incluida − necesaria)? Escribe el signo. | -21.35
?mc a2c | ¿Qué significa ese resultado? | Ganas 21,35 € extra | *Trabajas 21,35 € «gratis»: hay que subir algún % o revisar horas | No pasa nada | =La diferencia negativa es dinero que no cobras.
@act Crea la pestaña Análisis interno
1. En Empresa, A12:B14: tarifas de oficial (25 €/h), ayudante (18 €/h) y desplazamiento (20 €).
2. Pestaña «Análisis interno», títulos en la fila 4: Código · Cantidad · Coste unitario · Coste total · Venta total · MO incluida.
3. Fila 5 (lee la línea 13 del presupuesto): {{=SI(Presupuesto!A13="";"";Presupuesto!A13)}}, la cantidad, el coste con BUSCARV columna 5, coste total, venta total {{=Presupuesto!F13}} y la resta. Arrastra hasta la fila 24 y suma en la 25.
4. En I5:I7 las horas y desplazamientos; en I9 la mano de obra necesaria; en I11 la diferencia; en I13 un mensaje con SI.
?text a3 | Escribe la fórmula del mensaje de I13 (diferencia en I11) | f:=SI(I11>=0;"Los % cubren la mano de obra";"NO cubre: sube los %")
@act Ajusta y reflexiona
?long a4a | Con 4 h de oficial, ¿qué % subirías para volver a cubrir la mano de obra? Pruébalo y escribe el resultado.
?long a4b | Si un cliente pide «el precio de la mano de obra», ¿qué le respondes? Explica que tus precios son de suministro e instalación.
?mc a4c | ¿Por qué esta pestaña nunca se imprime ni se entrega? | Porque ocupa mucho | *Porque muestra tus costes y tus márgenes, que son información interna de la empresa | Porque tiene errores | =Es tu herramienta privada de control.
## Construye
[ ] El análisis interno del dormitorio da +3,65 €.
[ ] He ajustado mis % para que cubran las horas de mis presupuestos.
`});

UNITS.push({id:"4.1",block:4,title:"Planifica tu web",ses:"Sesión 17",ra:"RA2",drive:"Sube la foto de tu boceto a {{04_Web}}.",body:`
! Casi todos los clientes buscan «electricista cerca de mí» en el móvil antes de llamar. Una web sencilla, clara y con opiniones reales hace que te llamen a ti. Pero antes de abrir ningún programa, se planifica en papel.
## Aprende
Lo que busca un cliente en la web de un electricista: saber **qué haces y dónde**, ver **trabajos reales**, leer **opiniones**, **pedir presupuesto** o llamar sin buscar y comprobar que eres una empresa **seria y legal**.
| Página | Qué contiene | Unidad |
| Inicio | Logo, eslogan, qué haces y botón «Pide presupuesto» | 4.2 |
| Servicios | Tus trabajos, incluidos los servicios circulares | 4.4 |
| Trabajos | Portafolio con fotos del taller | 4.3 |
| Opiniones | Valoración media y opiniones publicadas | 4.6 |
| Pide presupuesto | Formulario con presupuesto aproximado | 4.5 |
| Normativa y consejos | Enlaces oficiales y consejos de seguridad | 4.7 |
| Contacto | Teléfono, WhatsApp, mapa, horario y aviso legal | 4.7 |
@act Analiza la competencia
Busca en Google «electricista» y el nombre de tu localidad. Abre tres webs **en el móvil** y puntúalas de 1 a 5.
?tbl a1 | Análisis de webs | Web 1;Web 2;Web 3 | Se entiende qué hacen en 5 segundos;Fotos de trabajos reales;Opiniones de clientes;Fácil pedir presupuesto o llamar;Se ve bien en el móvil;Muestra aviso legal y privacidad | 1;2;3;4;5
?long a1b | ¿Qué copiarías de la mejor web y qué evitarías de la peor?
@act Tu cliente ideal
@ex Ejemplo resuelto: Chispazo
**Marisa, 52 años**, vive en un piso de los 80 en Málaga. Quiere reformar la cocina y le preocupa que «salten los plomos». Busca en el móvil por la noche, lee opiniones y prefiere WhatsApp a llamar.
@/ex

@act La frase principal
@ex Ejemplo resuelto
«Electricistas en Málaga: reformas, cuadros y recarga de coche eléctrico» (10 palabras: qué, dónde y servicios estrella).
@/ex
?text a3 | Escribe la frase principal de tu web (máximo 12 palabras) | maxw:12
@act Boceto en el móvil
Dibuja en un folio la página de Inicio **vista en un móvil**: logo arriba, frase principal, botón grande de «Pide presupuesto», tres servicios y una opinión. Haz una foto y súbela a {{04_Web}}.
?link a4 | Enlace a la foto de tu boceto

UNITS.push({id:"4.2",block:4,title:"Crea la web con Google Sites",ses:"Sesión 18",ra:"RA3",body:`
! Google Sites crea webs arrastrando bloques, sin programar, y las guarda en tu Drive. Es una aplicación en la nube (SaaS): en una sesión tendrás el esqueleto de tu web con tu marca.

1. Entra en sites.google.com con tu cuenta del centro y pulsa **+ (En blanco)**. Mueve el sitio a tu carpeta {{04_Web}}.
2. **Temas:** elige uno sencillo y cambia el color principal por tu color corporativo.
3. **Encabezado:** imagen de fondo (un cuadro eléctrico del taller) y tu eslogan.

5. **Páginas:** crea las 7 páginas del mapa de la unidad 4.1.

?mc a2b | Quieres añadir la página «Opiniones». | Insertar | Temas | *Páginas | =En Páginas creas, ordenas y anidas páginas.
?mc a2c | Quieres ver cómo queda en un móvil. | *Vista previa y el icono del teléfono | Publicar | Configuración | =La vista previa simula móvil, tablet y ordenador.

UNITS.push({id:"4.3",block:4,title:"Tu portafolio de trabajos",ses:"Sesión 19",ra:"Proyecto",body:`
! Las fotos de trabajos bien hechos son tu mejor publicidad. Vas a fotografiar las instalaciones del taller y presentarlas como un profesional.
## Aprende: la foto profesional
- **Luz:** de día o con buena iluminación, sin contraluz.
- **Orden:** recoge herramientas y restos antes de disparar. Un cuadro bien peinado vende solo.
- **Antes y después:** dos fotos desde el mismo ángulo cuentan una historia.
- **Privacidad:** sin caras de compañeros sin su permiso, sin matrículas, direcciones ni datos de clientes.
- **Peso:** fotos de menos de 2 MB para que la web cargue rápido en el móvil.
- **Texto alternativo:** describe la imagen para personas con discapacidad visual y para los buscadores.
@act ¿Buena o mala foto?
?mc a1a | Foto de un cuadro hecha de noche con el flash, con reflejos en la tapa. | Buena | *Mala | =Los reflejos tapan el trabajo: mejor con luz natural y sin tapa.
?mc a1b | Foto de una instalación en panel con un compañero sonriendo delante, sin haberle pedido permiso. | Buena | *Mala | =Necesitas su permiso para publicar su imagen.
?mc a1c | Dos fotos desde el mismo ángulo: caja de registro antes (cables sueltos) y después (bornes ordenados). | *Buena | Mala | =El antes y después demuestra tu trabajo.
?mc a1d | Foto del cuadro con la etiqueta del cliente «Juan Pérez, C/ Larios 5» visible. | Buena | *Mala | =Nunca publiques datos personales de clientes.
@act Fotografía tus trabajos
1. Fotografía tres trabajos tuyos del taller (un cuadro, una instalación de vivienda en panel, un circuito conmutado o los que tengas).
2. Guárdalos en {{03_Fotos_trabajos}} con nombre {{AAAA-MM-DD_Trabajo}}.
?link a2 | Enlace a tu carpeta 03_Fotos_trabajos
@act Escribe el texto alternativo
@ex Ejemplo resuelto
Mal: «foto1». Bien: «Cuadro de vivienda con diferencial y cinco magnetotérmicos rotulados».
@/ex
?text a3a | Texto alternativo de tu foto 1 | maxw:15
?text a3b | Texto alternativo de tu foto 2 | maxw:15
?text a3c | Texto alternativo de tu foto 3 | maxw:15
@act Fichas de trabajo
?tbl a4 | Una ficha por trabajo | Trabajo 1;Trabajo 2;Trabajo 3 | Título;Problema del cliente;Solución;Material principal;Tiempo empleado
@act Monta el portafolio
[ ] En la página Trabajos he insertado un carrusel o una cuadrícula con mis fotos.
[ ] Debajo de cada foto hay un título y dos líneas de la ficha.
[ ] Todas las fotos tienen texto alternativo (clic en la imagen > tres puntos > *Texto alternativo*).
## Construye
[ ] Mi portafolio está publicado con tres trabajos.
`});

UNITS.push({id:"4.4",block:4,title:"Textos con inteligencia artificial",ses:"Sesión 20",ra:"RA4",body:`
! La inteligencia artificial generativa escribe borradores en segundos, pero se equivoca y a veces se inventa cosas. El profesional la usa como ayudante y **revisa todo** antes de publicar: lo que dice tu web es responsabilidad tuya.
## Aprende: cómo pedir bien (fórmula RTCFT)
| Parte | Ejemplo |
| Rol | Actúa como redactor de webs para pequeñas empresas de instalaciones. |
| Tarea | Escribe la descripción de 5 servicios para mi web. |
| Contexto | Mi empresa se llama Chispazo, trabaja en viviendas y comercios de Málaga: cuadros, reformas, recarga de coche eléctrico, averías y paso a LED. |
| Formato | Para cada servicio: título de 4 palabras máximo y 2 frases. |
| Tono | Cercano, claro, sin tecnicismos, sin exagerar. |
## Aprende: lo que la IA nunca decide por ti
- **La verdad:** borra años de experiencia, certificaciones, garantías o premios que no tienes. Prometer lo que no es cierto es publicidad engañosa.
- **Los datos personales:** no escribas en una IA nombres, teléfonos o direcciones de clientes.
- **La técnica:** comprueba lo que dice de normativa o seguridad.
- **Las imágenes:** si usas imágenes generadas con IA, que no parezcan trabajos tuyos reales.
@act Mejora un mal prompt
@ex Ejemplo resuelto
Mal: «hazme una web de electricista». Bien: el prompt de la tabla de arriba, con las cinco partes.
@/ex
?long a1 | Mejora este prompt: «escribe algo para la página de contacto»
@act Tu prompt RTCFT
?tbl a2 | Escribe tu prompt para la página Servicios | Mi texto | Rol;Tarea;Contexto;Formato;Tono
@act Revisa lo que escribe la IA
Pide los textos a la IA que permita tu centro y compara.
?tbl a3 | La IA escribió... | ¿Es verdad o correcto?;Lo cambio por... | Frase 1;Frase 2;Frase 3
@act ¿Qué no le das a la IA?
?mc a4a | ¿Cuál de estos datos NO debes escribir en una IA? | El nombre de tu empresa inventada | *El teléfono y la dirección de un cliente real | Los servicios que ofreces | =Los datos personales de terceros están protegidos.
?mc a4b | La IA escribe: «Más de 20 años de experiencia y certificación ISO». Tu empresa es nueva. | Lo dejo, queda bien | *Lo borro: es falso y es publicidad engañosa | Lo cambio a 10 años | =Solo se publica lo que es verdad.
?mc a4c | La IA dice que «cualquier persona puede cambiar un cuadro eléctrico sin ser instalador». | Lo publico | *Lo compruebo y lo quito: es incorrecto y peligroso | Lo pongo en letra pequeña | =La IA puede equivocarse en temas técnicos y de seguridad.
@act Quiénes somos
?long a5 | Escribe tú (sin IA) el párrafo «Quiénes somos» de tu web | maxw:60
## Construye
[ ] La página Servicios tiene mis textos revisados, incluidos los servicios circulares.
[ ] La página Inicio tiene mi párrafo «Quiénes somos».
`});

UNITS.push({id:"4.5",block:4,title:"Pide tu presupuesto: formulario y cálculo automático",ses:"Sesiones 21 y 22",ra:"RA3 · RA4",drive:"El formulario y su hoja de respuestas deben estar en {{04_Web}} y {{02_Presupuestos}}.",body:`
! Vas a unir tu web con tu hoja de cálculo: el cliente rellena un formulario, sus datos llegan solos a Google Sheets y una fórmula calcula al momento un **presupuesto aproximado**. Tú solo revisas y contestas.
@ses Sesión 1: el formulario
@act Diseña las preguntas
| Pregunta | Tipo | Obligatoria |
| Nombre | Respuesta corta | Sí |
| Teléfono | Respuesta corta | Sí |
| Email | Respuesta corta | No |
| Localidad | Respuesta corta | Sí |
| Tipo de trabajo | Desplegable con las 5 opciones de la tabla de tarifas, escritas exactamente igual | Sí |
| Cantidad (puntos, m² u horas) | Respuesta corta con validación: número | Sí |
| Describe lo que necesitas | Párrafo | No |
| Acepto la política de privacidad | Casilla | Sí |
?mc a1a | ¿Qué tipo de pregunta usarías para «Tipo de trabajo»? | Respuesta corta | *Desplegable | Párrafo | =Con un desplegable el texto llega siempre igual y la fórmula lo encuentra.
?mc a1b | ¿Por qué la cantidad lleva validación de número? | Por estética | *Para que nadie escriba «unos cuantos» y la fórmula pueda calcular | Porque lo exige la ley | =La fórmula necesita un número.
?mc a1c | ¿Por qué el email no es obligatorio? | *Porque pedir solo los datos imprescindibles respeta la privacidad y no frena al cliente | Porque no sirve | Porque Forms no admite emails | =Pide lo mínimo necesario.
@act Crea el formulario
1. En {{04_Web}}: *Nuevo > Formularios de Google*. Título: «Pide tu presupuesto sin compromiso». Logo y colores con el icono de la paleta.
2. Crea las preguntas de la tabla.
3. En *Respuestas* pulsa **Vincular con Hojas de cálculo** y elige tu archivo de presupuestos.
4. Renombra la pestaña nueva como **Respuestas formulario** y añade a mano la columna «Estado» (desplegable: Pendiente, Enviado, Aceptado, Rechazado).
5. En Sites, página Pide presupuesto: *Insertar > Formularios*.
?link a2 | Enlace a tu formulario (botón Enviar > icono de enlace)
> **Ojo:** no escribas fórmulas dentro de la pestaña de respuestas: Forms añade filas nuevas y las fórmulas no las siguen. Los cálculos van en otra pestaña.
@act Prueba el formulario
[ ] He hecho tres envíos de prueba con datos inventados y han llegado a la hoja.
[ ] Un compañero ha enviado una solicitud desde mi web.
@ses Sesión 2: el cálculo automático
@act Tarifas y fórmulas
Crea la pestaña **Solicitudes**. En K5:N9 tus tarifas orientativas (sin IVA) y en L12 el margen de la horquilla, 15%.
| Tipo de trabajo | Unidad | Precio por unidad | Fijo |
| Punto de luz o enchufe nuevo | punto | 45 € | 30 € |
| Cuadro eléctrico nuevo | ud | 350 € | 0 € |
| Reforma integral de vivienda | m² | 38 € | 0 € |
| Punto de recarga de vehículo eléctrico | ud | 900 € | 0 € |
| Avería o reparación | hora | 35 € | 20 € |
$ Estimación = Fijo + Cantidad × Precio por unidad
| Celda | Fórmula |
| A5 | {{=SI('Respuestas formulario'!A2="";"";'Respuestas formulario'!A2)}} |
| B5, C5, D5 | Igual, leyendo nombre (B), tipo (F) y cantidad (G) |
| E5 | {{=SI(A5="";"";BUSCARV(C5;$K$5:$N$9;4;FALSO)+D5*BUSCARV(C5;$K$5:$N$9;3;FALSO))}} |
| F5 | {{=SI(A5="";"";REDONDEAR(E5*(1-$L$12);0))}} |
| G5 | {{=SI(A5="";"";REDONDEAR(E5*(1+$L$12);0))}} |
@act Comprueba las estimaciones
?num a5a | 4 puntos de luz o enchufe: estimación | 210
?num a5b | 4 puntos: mínimo de la horquilla | 179
?num a5c | 4 puntos: máximo de la horquilla | 241
?num a5d | Reforma integral de 75 m²: estimación | 2850
?num a5e | Avería de 2 horas: estimación | 90
@act Contesta al cliente
@ex Ejemplo resuelto
«Hola, Carmen: gracias por confiar en Chispazo. Para 4 puntos de luz o enchufe nuevos, el precio orientativo está entre 179 € y 241 € + IVA. Para darte el precio exacto necesitamos ver la instalación: ¿te viene bien el jueves por la mañana? Un saludo.»
@/ex
?long a6 | Escribe tu respuesta a la solicitud de un compañero, con su horquilla de precio
?link a6b | Enlace a tu hoja con la pestaña Solicitudes
## Construye
[ ] El formulario está en mi web y las respuestas llegan a mi hoja.
[ ] La pestaña Solicitudes calcula la horquilla y el caso de prueba da 210 €.
`});

UNITS.push({id:"4.6",block:4,title:"Opiniones de clientes",ses:"Sesión 23",ra:"RA4",body:`
! Las opiniones deciden muchas contrataciones. Vas a recoger opiniones con un formulario, moderarlas y mostrar en la web solo las que el cliente autoriza, con su valoración media. Y vas a aprender por qué **inventarse opiniones está prohibido**.
## Aprende: las reglas del juego
- **Las opiniones falsas están prohibidas.** Desde 2022, la Ley de Competencia Desleal (artículo 27, modificado por el Real Decreto-ley 24/2021) prohíbe publicar o encargar opiniones falsas y presentar opiniones como reales sin comprobar que vienen de clientes.
- **Moderar no es censurar:** se quitan insultos, datos personales o publicidad, pero **no** las opiniones negativas por ser negativas. Contestar bien a una crítica da más confianza que tener solo cinco estrellas.
- **Consentimiento:** solo se publica si el cliente lo acepta, con el nombre que él elija («Javier M.»).
> En este proyecto, las opiniones las escriben compañeros, profesores o familiares que **han visto de verdad** un trabajo tuyo del taller, y tu web dice que es un proyecto educativo. Así practicas sin engañar a nadie.
@act ¿Se publica o no?
?mc a1a | «Unos sinvergüenzas, ojalá os arruinéis.» | Se publica | *No se publica: es un insulto | =Se modera el insulto, no la crítica.
?mc a1b | «Tardaron un día más de lo previsto, pero el trabajo quedó muy bien.» (acepta publicar) | *Se publica | No se publica | =Una crítica respetuosa da credibilidad.
?mc a1c | «Muy bien. Si queréis, llamad a mi vecina Lola al 600 123 456.» | Se publica tal cual | *No se publica con el teléfono: es un dato personal de otra persona | =Se puede publicar quitando el dato, si el cliente está de acuerdo.
?mc a1d | Opinión de 5 estrellas, pero el cliente marcó «No acepto que se publique». | Se publica | *No se publica | =Sin consentimiento, no.
?mc a1e | Un amigo que nunca ha visto tu trabajo te escribe una opinión de 5 estrellas para ayudarte. | *No se publica: sería una opinión falsa, prohibida por la ley | Se publica, es un amigo | =Solo valen opiniones de quien conoce tu trabajo de verdad.
@act Responde a una crítica
@ex Ejemplo resuelto
Crítica: «Encontraron la avería rápido, pero algo caro el servicio urgente.» Respuesta: «Gracias, Antonio. El servicio urgente incluye la salida inmediata en festivo; para revisiones programadas tenemos tarifa normal. ¡Nos alegra que todo funcione!»
@/ex
?long a2 | Responde a esta opinión: «Buen trabajo, pero dejaron polvo en el pasillo.»
@act Formulario y moderación
1. Crea el formulario «¿Qué tal lo hicimos?»: Nombre para mostrar, Trabajo realizado (desplegable), Puntuación (escala lineal 1 a 5), Comentario y «¿Aceptas que publiquemos tu opinión?» (Sí/No).
2. Vincúlalo a tu hoja y renombra la pestaña como **Opiniones**. Añade a mano la columna G «Publicar (moderación)» con desplegable Sí/No.
3. Crea la pestaña **Publicadas**. En A5, una sola fórmula muestra las opiniones aceptadas y moderadas:
$ =FILTER(Opiniones!B2:E; Opiniones!F2:F="Sí"; Opiniones!G2:G="Sí")
?text a3 | Escribe la fórmula FILTER sin mirar | f:=FILTER(Opiniones!B2:E;Opiniones!F2:F="Sí";Opiniones!G2:G="Sí")
@act La media con estrellas
?num a4a | Tres opiniones publicadas con 5, 4 y 4 estrellas. ¿Cuál es la media? (un decimal) | 4.3 | 0.05
?mc a4b | ¿Qué devuelve {{=REPETIR("★";4)}}? | 4★ | *★★★★ | ★ | =Repite el símbolo tantas veces como indica el número.
@act Muestra las opiniones en la web
1. *Archivo > Compartir > Publicar en la web*, elige solo la pestaña «Publicadas» y copia el enlace.
2. En Sites, página Opiniones: *Insertar > Insertar > Por URL*. Debajo, inserta el formulario de opiniones.
?link a5 | Enlace a tu página de opiniones publicada
## Construye
[ ] Tengo al menos 3 opiniones reales de compañeros y he moderado una explicando por qué.
[ ] La web muestra las opiniones publicadas y ninguna es inventada.
`});

UNITS.push({id:"4.7",block:4,title:"Normativa, contacto y aspectos legales",ses:"Sesión 24",ra:"Proyecto",body:`
! Un electricista trabaja con normas de seguridad y una web trabaja con normas de privacidad. Mostrar las dos cosas transmite profesionalidad y te protege.
## Aprende: enlaces para tu página «Normativa y consejos»
| Enlace | Para qué sirve al cliente |
| [Reglamento electrotécnico para baja tensión (BOE)](https://www.boe.es/eli/es/rd/2002/08/02/842) | La norma que cumple toda instalación de su casa |
| [Guía técnica del REBT (Ministerio)](https://industria.gob.es/Calidad-Industrial/seguridadindustrial/instalacionesindustriales/baja-tension/Paginas/guia-tecnica-aplicacion.aspx) | Explicaciones oficiales de cada instrucción técnica |
| [Energía eléctrica · Junta de Andalucía](https://www.juntadeandalucia.es/organismos/universidadindustriaenergiaeinnovacion/areas/energia/electricidad.html) | Trámites de instalaciones en Andalucía |
| [Autoconsumo: RD 244/2019 (BOE)](https://www.boe.es/eli/es/rd/2019/04/05/244) | Normas para instalar placas solares |
## Aprende: aviso legal y privacidad
Toda web de empresa debe identificar al titular (Ley 34/2002, LSSI) y explicar qué hace con los datos personales que recoge (RGPD y Ley Orgánica 3/2018). Más información en [aepd.es](https://www.aepd.es).
@act ¿Qué norma es?
?mc a1a | ¿Qué norma regula las instalaciones eléctricas de una vivienda? | *El Reglamento electrotécnico para baja tensión (REBT) | La Ley de Competencia Desleal | El RGPD | =El REBT y sus instrucciones técnicas (ITC-BT).
?mc a1b | ¿Qué ley obliga a que tu web diga quién es el titular? | El REBT | *La Ley de servicios de la sociedad de la información (LSSI) | La Ley de Competencia Desleal | =La LSSI exige identificar a quien está detrás de la web.
?mc a1c | Recoges nombre y teléfono en tu formulario. ¿Qué norma te obliga a explicar para qué los usas? | *El RGPD y la Ley Orgánica 3/2018 | El REBT | Ninguna | =Son las normas de protección de datos.
@act Consejos de seguridad para tus clientes
@ex Ejemplo resuelto
«**Prueba el diferencial cada mes:** pulsa el botón de test del cuadro; si no salta, llámanos.»
@/ex
?long a2a | Consejo 1
?long a2b | Consejo 2
?long a2c | Consejo 3
> Revisa tus consejos con el profesor antes de publicarlos: un consejo de seguridad equivocado es peligroso.
@act Página de contacto
?text a3a | Tu enlace de WhatsApp (https://wa.me/34 seguido de 9 cifras, sin espacios) | re:^https://wa\\.me/34\\d{9}$ | Debe ser https://wa.me/34 y 9 cifras seguidas, sin espacios.
?text a3b | Municipios donde trabajas
?text a3c | Horario de atención
[ ] He insertado el mapa de mi zona (*Insertar > Mapa*).
[ ] He creado el código QR de mi web (en Chrome: *Compartir > Crear código QR*) y lo he guardado en {{01_Marca}}.
@act Tu aviso legal y de privacidad
?tbl a4 | Rellena con los datos de tu empresa ficticia | Texto | Responsable (nombre, CIF, email);Finalidad de los datos;Cuánto tiempo se guardan;Derechos del cliente y cómo ejercerlos
## Construye
[ ] Las páginas Normativa y Contacto están terminadas y sus enlaces funcionan.
[ ] El aviso legal está enlazado desde el formulario de presupuesto.
`});

UNITS.push({id:"4.8",block:4,title:"Publica, prueba y mejora",ses:"Sesión 25",ra:"Coevaluación",body:`
! Una web no está terminada hasta que otra persona la usa sin ayuda. Hoy publicas la tuya y haces de «cliente misterioso» en la de un compañero.
@act Publica
1. Pulsa **Publicar**, elige la dirección y comprueba quién puede verla (tu profesor te dirá si es solo para el centro).
2. Abre la web en tu móvil.
?link a1 | Dirección pública de tu web
@act Lista de calidad
?tbl a2 | Revisa tu web y la de tu compañero | Mi web;Web del compañero | Se entiende qué hacemos en 5 segundos;Todas las páginas y enlaces funcionan;Las fotos cargan rápido y tienen texto alternativo;El formulario de presupuesto llega a la hoja;Se ven las opiniones y la media;Sin faltas de ortografía;Buen contraste: se lee al sol;Pie de proyecto educativo y aviso legal | ✓;✗
@act Cliente misterioso
Pide un presupuesto de prueba en la web de tu compañero y deja una opinión sincera sobre su web.
?text a3a | ¿De quién es la web que has probado?
?long a3b | Tres mejoras que le propones
?long a3c | ¿Qué mejoras te ha propuesto tu compañero y cuáles has aplicado?
@act Que te encuentren en Google
@ex Ejemplo resuelto
Título de la web: «Electricista en Málaga · Chispazo». Servicio + localidad + marca: es lo que la gente escribe en el buscador.
@/ex
?text a4 | Escribe el título de tu web con servicio, localidad y marca | maxw:8
> **Consejo de profesional:** las empresas reales crean también un *Perfil de empresa en Google* (la ficha de Google Maps). Es gratis y es donde más opiniones reciben.
## Construye
[ ] Mi web está publicada y la ha probado un compañero.
[ ] He aplicado al menos dos mejoras.
