UNITS.push({id:"5.1",block:5,title:"Industria 4.0 e IoT en las instalaciones",ses:"Sesión 26",ra:"RA2",body:`
! La cuarta revolución industrial une el mundo físico (cables, motores, sensores) con el digital (datos, internet, software). Para un electricista significa que cada vez más instalaciones «hablan»: avisan de averías, miden consumos y se controlan desde el móvil.
## Aprende: las cuatro revoluciones
| Revolución | Tecnología clave | Cómo cambió el trabajo |
| 1.ª (finales s. XVIII) | Máquina de vapor | De la producción manual a las máquinas |
| 2.ª (finales s. XIX) | Electricidad y cadena de montaje | Producción en serie; nacen los electricistas |
| 3.ª (mediados s. XX) | Electrónica, ordenadores y autómatas (PLC) | Automatización de procesos |
| 4.ª (actual) | Sistemas ciberfísicos, IoT, nube, IA | Máquinas e instalaciones conectadas que se ajustan con datos |
Un **sistema ciberfísico** combina una parte física (un cuadro con protecciones) y una digital (software y comunicaciones) que se controlan mutuamente. El **IoT** (internet de las cosas) son objetos con sensores conectados a internet.
## IoT en el día a día del electricista
- **Contador inteligente:** la distribuidora lee el consumo a distancia.
- **Protecciones conectadas:** avisan al móvil si saltan y algunas se rearman a distancia.
- **Monitor de consumo:** pinzas en el cuadro que miden cada circuito.
- **Punto de recarga conectado:** carga en las horas más baratas y reparte potencia con la vivienda.
- **Domótica:** luces, persianas y climatización por escenas, horarios o sensores.
@act ¿Qué revolución es?
?mc a1a | Un autómata (PLC) controla una cinta transportadora siguiendo un programa fijo. | 2.ª | *3.ª | 4.ª | =Automatización con electrónica: tercera revolución.
?mc a1b | La cinta transportadora envía datos a la nube y una IA ajusta su velocidad para ahorrar energía. | 2.ª | 3.ª | *4.ª | =Sistema ciberfísico conectado que aprende de los datos.
?mc a1c | Se instala el primer motor eléctrico en un taller que antes usaba una máquina de vapor. | *2.ª | 3.ª | 4.ª | =La electricidad es la clave de la segunda revolución.
@act ¿Es un sistema ciberfísico?
?mc a2a | Un interruptor de pared normal. | Sí | *No | =No tiene parte digital ni comunicaciones.
?mc a2b | Un diferencial que mide fugas, envía un aviso al móvil y se rearma desde la app. | *Sí | No | =Parte física y digital que se controlan mutuamente.
?mc a2c | Un termostato que aprende tus horarios y enciende la calefacción antes de que llegues. | *Sí | No | =Mide, procesa datos y actúa sobre la instalación.
@act La vivienda conectada
Una clienta quiere controlar su casa desde el móvil y gastar menos. En grupos, elegid tres dispositivos IoT.
?tbl a3 | Propuesta para la clienta | Qué mide o controla;Ventaja para la clienta;Ventaja para tu empresa | Dispositivo 1;Dispositivo 2;Dispositivo 3
@act Nuevos servicios gracias al IoT
@ex Ejemplo resuelto
Un monitor de consumo detecta que el termo eléctrico funciona de madrugada en la hora cara. Servicio nuevo: «Revisión energética con datos»: el electricista analiza las gráficas, programa el termo en horas baratas y cobra una cuota anual de seguimiento.
@/ex
?long a4 | Si un diferencial conectado avisa a tu empresa de que salta cada noche, ¿qué servicio nuevo podrías ofrecer? ¿Cómo lo cobrarías?
## Construye
[ ] He diseñado la propuesta de vivienda conectada.
`});

UNITS.push({id:"5.2",block:5,title:"Gymkhana de tecnologías habilitadoras",ses:"Sesión 27",ra:"RA4",body:`
! Las **tecnologías habilitadoras digitales (THD)** son las que hacen posible la empresa 4.0. Hoy las investigáis por estaciones y buscáis para cada una un uso real en el oficio.
## Cómo se juega
1. Grupos de 3. Cada grupo recibe dos tecnologías al azar.
2. 20 minutos: buscad qué es, un ejemplo real en electricidad y qué mejora (tiempo, coste, seguridad o calidad).
3. Cada grupo lo explica en 2 minutos con una imagen o un vídeo corto.
4. El resto completa su tabla. Gana el ejemplo más útil, votado por la clase.
*Pistas:* termografía de cuadros y placas con drones · gafas de realidad aumentada para ver por dónde van los tubos · gemelo digital de un edificio (BIM) · impresión 3D de soportes · IA que detecta defectos en fotos de instalaciones.
@act Mis dos tecnologías
?text a1a | Tecnologías que le han tocado a mi grupo
?long a1b | Guion de nuestra explicación de 2 minutos
@act Tabla de la gymkhana

@act ¿Qué tecnología es?
?mc a3a | Un dron con cámara térmica detecta un panel solar que se calienta más que los demás. | Blockchain | *Drones y termografía | 5G | =La imagen térmica muestra puntos calientes sin subir al tejado.
?mc a3b | Unas gafas muestran sobre la pared real por dónde van los tubos empotrados. | *Realidad aumentada | Realidad virtual | Gemelo digital | =Superpone información digital sobre lo que ves.
?mc a3c | Una copia virtual de un hospital avisa de que un cuadro trabaja al 90% de su capacidad. | Big data | *Gemelo digital | Robótica | =Es una réplica virtual alimentada con datos reales.
?mc a3d | Se imprime una tapa de repuesto para una caja de registro descatalogada. | *Impresión 3D | IoT | 5G | =Fabricación aditiva: piezas a medida sin molde.
@act Tu elección

UNITS.push({id:"5.3",block:5,title:"Decide con datos: el panel de tu empresa",ses:"Sesión 28",ra:"RA4",body:`
! Tu web ya genera datos: solicitudes, tipos de trabajo, presupuestos aceptados, opiniones. Un **panel** los resume en pocas cifras y un gráfico para tomar decisiones, como hacen las grandes empresas con el big data.
## Aprende: tres funciones nuevas
| Función | Qué hace | Ejemplo |
| CONTAR.SI | Cuenta las celdas que cumplen una condición | {{=CONTAR.SI(Solicitudes!C5:C34;"Avería o reparación")}} |
| SUMAR.SI | Suma solo lo que cumple una condición | {{=SUMAR.SI(Solicitudes!C5:C34;A4;Solicitudes!E5:E34)}} |
| PROMEDIO.SI.CONJUNTO | Media de lo que cumple varias condiciones | Valoración media de las opiniones publicadas |
@act Ejemplo con datos
@ex Ejemplo resuelto
Columna H de Solicitudes: Enviado, Aceptado, Pendiente, Aceptado, Rechazado, Pendiente. {{=CONTAR.SI(H5:H34;"Aceptado")}} → **2**.
@/ex
?text a1a | Escribe la fórmula que cuenta cuántas solicitudes están «Pendiente» en H5:H34 | f:=CONTAR.SI(H5:H34;"Pendiente")
?text a1b | Escribe la fórmula que suma las estimaciones (E5:E34) de los trabajos de tipo que está en A4 (tipos en C5:C34) | f:=SUMAR.SI(C5:C34;A4;E5:E34)
@act Construye la pestaña Panel
1. A4:A8: los 5 tipos de trabajo ({{=Solicitudes!K5}}...).
2. B4: cuántas solicitudes de ese tipo (CONTAR.SI). C4: importe estimado (SUMAR.SI). Arrastra y suma en la fila 9.
3. A12:A15: Pendiente, Enviado, Aceptado, Rechazado, y cuántos hay de cada uno.
4. **Tasa de aceptación** = aceptados / (enviados + aceptados + rechazados).
5. Selecciona A3:B8 > *Insertar > Gráfico* de barras.
Comprueba con los datos de ejemplo del profesor:
?num a2a | Número total de solicitudes | 6
?num a2b | Importe estimado total (€) | 4700
?num a2c | Tasa de aceptación (%) | 50 | 0.5
?num a2d | Valoración media publicada (un decimal) | 4.3 | 0.05
?link a2e | Enlace a tu hoja con la pestaña Panel
@act Interpreta tu panel
?long a3a | ¿Qué servicio te piden más? ¿Y cuál deja más dinero?
?long a3b | Si la tasa de aceptación es baja, ¿qué cambiarías: precios, rapidez de respuesta, fotos de la web...?
?long a3c | ¿Qué dato te gustaría medir y todavía no recoges?
?mc a3d | El panel muestra muchas solicitudes de recarga de coche eléctrico pero ninguna aceptada. ¿Qué decisión tiene más sentido? | Dejar de ofrecer el servicio | *Revisar el precio y llamar a esos clientes para saber por qué no aceptan | Subir el precio | =Los datos indican un problema; hablar con los clientes da la causa.
## Construye
[ ] Mi panel funciona y tiene gráfico.
[ ] He interpretado mis datos y propuesto una decisión.
`});

    const L=raw.replace(/\s+$/,"");const t=L.trim();
    if(!t){close();return;}
    if(t.startsWith("@/ex")){close();ex=null;cur=act?act.c:out;return;}
    if(t.startsWith("@ex")){close();ex={k:"ex",t:t.slice(3).trim()||"Ejemplo resuelto",c:[]};(act?act.c:out).push(ex);cur=ex.c;return;}
    if(t.startsWith("@act")){close();ex=null;an++;act={k:"act",n:an,t:t.slice(4).trim(),c:[]};out.push(act);cur=act.c;return;}
    if(t.startsWith("@end")){close();act=null;ex=null;cur=out;return;}
    if(t.startsWith("@ses")){close();act=null;ex=null;cur=out;out.push({k:"ses",t:t.slice(4).trim()});return;}
    if(t.startsWith("## ")){close();act=null;ex=null;cur=out;out.push({k:"h2",t:t.slice(3)});return;}
    if(t.startsWith("### ")){close();push({k:"h3",t:t.slice(4)});return;}
    if(t.startsWith("! ")){close();push({k:"lead",t:t.slice(2)});return;}
    if(t.startsWith("> ")){close();push({k:"tip",t:t.slice(2)});return;}
    if(t.startsWith("!! ")){close();push({k:"warn",t:t.slice(3)});return;}
    if(t.startsWith("$ ")){close();push({k:"code",t:t.slice(2)});return;}
    if(t.startsWith("@img")){close();push({k:"img"});return;}
    if(t.startsWith("@tree")){close();push({k:"tree",t:t.slice(5).replace(/\\n/g,"\n")});return;}
    if(t.startsWith("[ ] ")){if(!list||list.k!=="chk"){list={k:"chk",items:[]};push(list);}chkN++;list.items.push({id:"c"+chkN,t:t.slice(4)});return;}
    if(t.startsWith("- ")){if(!list||list.k!=="ul"){list={k:"ul",items:[]};push(list);}list.items.push(t.slice(2));return;}
    if(/^\d+\.\s/.test(t)){if(!list||list.k!=="ol"){list={k:"ol",items:[]};push(list);}list.items.push(t.replace(/^\d+\.\s/,""));return;}
    if(t.startsWith("|")){const cells=t.replace(/^\||\|$/g,"").split("|").map(x=>x.trim());if(!list||list.k!=="table"){list={k:"table",rows:[]};push(list);}list.rows.push(cells);return;}
    if(t.startsWith("?")){close();const sp=t.indexOf(" ");const type=t.slice(1,sp);const parts=t.slice(sp+1).split("|").map(x=>x.trim());push({k:"q",type,id:parts[0],label:parts[1]||"",a:parts.slice(2)});return;}
    close();push({k:"p",t});
  });
  return out;
}

const num=v=>{if(v==null)return NaN;let s=String(v).replace(/[€%\s]/g,"");if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"");s=s.replace(",",".");return s===""?NaN:Number(s);};
const EN={"SUM":"SUMA","VLOOKUP":"BUSCARV","IF":"SI","FALSE":"FALSO","TRUE":"VERDADERO","ROUND":"REDONDEAR","COUNTIF":"CONTAR.SI","SUMIF":"SUMAR.SI","COUNTA":"CONTARA","AVERAGEIFS":"PROMEDIO.SI.CONJUNTO","REPT":"REPETIR","AVERAGE":"PROMEDIO"};
function fnorm(s){s=String(s||"").toUpperCase().replace(/\s+/g,"").replace(/;/g,",");s=s.replace(/[A-Z.]+(?=\()/g,m=>EN[m]||m).replace(/\bFALSE\b/g,"FALSO");if(s&&s[0]!=="=")s="="+s;return s;}
const tnorm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function check(n,v){
  if(v==null||String(v).trim()==="")return null;
  const a=n.a[0]||"";
  if(n.type==="num"){const x=num(v),y=num(a),tol=n.a[1]?num(n.a[1]):0.006;if(isNaN(x))return {ok:false,m:"Escribe solo el número (usa coma para los decimales)."};if(isNaN(y))return null;return Math.abs(x-y)<=tol?{ok:true,m:"¡Correcto!"}:{ok:false,m:"Todavía no. Revisa el cálculo."+(n.a[2]?" Pista: "+n.a[2]:"")};}
  if(a.startsWith("f:")){const opts=a.slice(2).split("§");return opts.some(o=>fnorm(o)===fnorm(v))?{ok:true,m:"¡Fórmula correcta!"}:{ok:false,m:"Revisa la fórmula: empieza por =, nombres de celda y punto y coma."};}
  if(a.startsWith("=")){const opts=a.slice(1).split("§");return opts.some(o=>tnorm(o)===tnorm(v))?{ok:true,m:"¡Correcto!"}:{ok:false,m:"Todavía no. Vuelve a mirarlo."};}
  if(a.startsWith("re:")){try{return new RegExp(a.slice(3),"i").test(String(v).trim())?{ok:true,m:"Formato correcto."}:{ok:false,m:n.a[1]||"El formato no es correcto."};}catch(e){return null;}}
  if(a.startsWith("maxw:")){const w=String(v).trim().split(/\s+/).filter(Boolean).length,mx=+a.slice(5);return w<=mx?{ok:true,m:w+" palabras (máximo "+mx+")."}:{ok:false,m:w+" palabras: te pasas del máximo de "+mx+"."};}
  if(n.type==="link"){return /^https?:\/\/\S+$/i.test(String(v).trim())?{ok:true,m:"Enlace guardado. Comprueba que el profesor tiene permiso para abrirlo."}:{ok:false,m:"Pega un enlace completo que empiece por https://"};}
  return null;
}
function answered(u,n){const v=S.ans[key(u,n.id)];if(n.k==="chk")return !!v;if(v==null)return false;if(typeof v==="object")return Object.values(v).some(x=>String(x).trim()!=="");return String(v).trim()!=="";}
function prog(u){if(!u.qs.length)return 1;return u.qs.filter(n=>answered(u,n)).length/u.qs.length;}

    UNITS.filter(u=>u.block===b.n).forEach(u=>{const pc=Math.round(prog(u)*100);h+='<a href="#u'+u.id+'" class="'+(cur==="u"+u.id?"on":"")+'"><span class="num">'+esc(u.id)+"</span><span>"+esc(u.title)+'</span><span class="pc'+(pc===100?" full":"")+'">'+(pc===100?"✓":pc+"%")+"</span></a>";});});
  h+='<div class="grp"><span>Consulta</span></div>'+PAGES.map(p=>'<a href="#'+p.id+'" class="'+(cur===p.id?"on":"")+'"><span class="num">'+p.ic+"</span>"+esc(p.title)+"</a>").join("");
  document.getElementById("side").innerHTML=h;
}
function route(){
  const h=location.hash.slice(1)||"inicio";let html;
  if(h==="inicio")html=home();else if(h==="insignias")html=badges();
  else if(h.startsWith("u")){const u=UNITS.find(x=>"u"+x.id===h);html=u?unitPage(u):home();}
  else{const p=PAGES.find(x=>x.id===h);html=p?staticPage(p):home();}
  $m().innerHTML=html;nav();hydrate();window.scrollTo(0,0);document.getElementById("side").classList.remove("open");
  const p=S.profile;document.getElementById("who").textContent=[p.nombre,p.apellidos].filter(Boolean).join(" ")+(p.grupo?" · "+p.grupo:"");
}
function curUnit(){const h=location.hash.slice(1);return UNITS.find(x=>"u"+x.id===h);}
function refreshProg(){const u=curUnit();if(!u)return;const pc=Math.round(prog(u)*100);const bar=document.querySelector(".page>.prog>i");if(bar)bar.style.width=pc+"%";const c=document.getElementById("pcnt");if(c)c.textContent=pc+"% respondido";nav();}

/* ---------- hydrate (feedback state) ---------- */
function findQ(k){for(const u of UNITS){for(const q of u.qs){if(key(u,q.id)===k)return q;}}return null;}
function showFb(k,force){const box=document.querySelector('[data-q="'+k+'"]');if(!box)return;const n=findQ(k);if(!n)return;const r=check(n,S.ans[k]);const fb=box.querySelector(".fb");box.classList.remove("ok","bad");
  const cnt=box.querySelector(".cnt");if(cnt){const w=String(S.ans[k]||"").trim().split(/\s+/).filter(Boolean).length;cnt.textContent=w+" palabras";}
  if(!r||(!force&&n.type!=="long"&&n.type!=="link"&&!S.ans[k+"#c"])){fb.textContent="";fb.className="fb";return;}
  fb.textContent=(r.ok?"✓ ":"✗ ")+r.m;fb.className="fb "+(r.ok?"ok":"bad");box.classList.add(r.ok?"ok":"bad");}
function mcState(k){const box=document.querySelector('[data-mc="'+k+'"]');if(!box)return;const n=findQ(k);const opts=n.a.filter(x=>!x.startsWith("="));const sel=S.ans[k];const fb=box.querySelector(".fb");
  box.querySelectorAll(".opt").forEach((b,i)=>{b.classList.remove("sel","good","wrong","show");if(sel!=null&&+sel===i){b.classList.add("sel",opts[i].startsWith("*")?"good":"wrong");}if(sel!=null&&opts[i].startsWith("*")&&!opts[+sel].startsWith("*"))b.classList.add("show");});
  if(sel==null){fb.textContent="";return;}const ok=opts[+sel].startsWith("*");fb.className="fb "+(ok?"ok":"bad");fb.textContent=(ok?"✓ ¡Bien! ":"✗ No es esa. ")+(fb.dataset.why||"");}
function hydrate(){
  Object.keys(S.ans).forEach(k=>{if(!k.endsWith("#c")){showFb(k);}});
  document.querySelectorAll("[data-mc]").forEach(b=>mcState(b.dataset.mc));
  document.querySelectorAll("[data-calc]").forEach(upCalc);
  document.querySelectorAll("[data-grid]").forEach(g=>newGrid(g.dataset.grid,true));
  document.querySelectorAll(".q textarea").forEach(t=>showFb(t.dataset.k));
}
/* grid game */
const G={};
function newGrid(k,keep){const box=document.querySelector('[data-grid="'+k+'"]');if(!box)return;const cols="ABCDEFGH",rows=8;const c=Math.floor(Math.random()*cols.length),r=1+Math.floor(Math.random()*rows);G[k]=cols[c]+r;
  let h='<div class="gridw" style="grid-template-columns:repeat('+(cols.length+1)+',34px)"><div class="hd"></div>'+[...cols].map(x=>'<div class="hd">'+x+"</div>").join("");
  for(let i=1;i<=rows;i++){h+='<div class="hd">'+i+"</div>"+[...cols].map((x,j)=>'<div class="'+(j===c&&i===r?"hit":"")+'"></div>').join("");}
  box.querySelector(".gw").innerHTML=h+"</div>";const inp=box.querySelector("input");inp.value="";const sc=S.ans[k]||{ok:0,n:0};box.querySelector(".fb").className="fb info";box.querySelector(".fb").textContent=keep?"Aciertos: "+sc.ok+" de "+sc.n+". ¿Cómo se llama la celda amarilla?":"¿Cómo se llama la celda amarilla?";}

/* ---------- events ---------- */
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.p!=null){S.profile[t.dataset.p]=t.value.trim();save();const p=S.profile;document.getElementById("who").textContent=[p.nombre,p.apellidos].filter(Boolean).join(" ");return;}
  if(t.classList.contains("pwd")){pwdMeter(t);return;}
  const k=t.dataset.k;if(!k)return;
  if(t.dataset.cell){S.ans[k]=Object.assign({},S.ans[k]||{});S.ans[k][t.dataset.cell]=t.value;save();const c=t.closest("[data-calc]");if(c)upCalc(c);refreshProg();return;}
  if(t.dataset.chk)return;
  S.ans[k]=t.value;delete S.ans[k+"#c"];save();const n=findQ(k);if(n&&(n.type==="long"||n.type==="link"))showFb(k,true);else showFb(k);refreshProg();});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.chk){S.ans[t.dataset.k]=t.checked;save();refreshProg();return;}
  if(t.dataset.import){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.ans)throw 0;if(confirm("¿Sustituir las respuestas de este navegador por las de la copia de "+((d.profile&&d.profile.nombre)||"sin nombre")+"?")){S=Object.assign({profile:{},ans:{}},d);save();route();toast("Copia recuperada");}}catch(x){alert("Ese archivo no es una copia válida del cuaderno.");}};r.readAsText(f);return;}
  if(t.tagName==="SELECT"&&t.dataset.k&&!t.dataset.cell){S.ans[t.dataset.k]=t.value;save();refreshProg();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){const b=e.target.parentElement.querySelector("[data-check],[data-gridchk]");if(b){e.preventDefault();b.click();}}});
document.addEventListener("click",e=>{const t=e.target.closest("button,a,label");if(!t)return;
  if(t.dataset.check){const k=t.dataset.check;S.ans[k+"#c"]=1;save();showFb(k,true);return;}
  if(t.classList.contains("opt")){const k=t.dataset.k;S.ans[k]=+t.dataset.i;save();mcState(k);refreshProg();return;}
  if(t.dataset.gridnew){newGrid(t.dataset.gridnew);return;}
  if(t.dataset.gridchk){const k=t.dataset.gridchk,box=document.querySelector('[data-grid="'+k+'"]'),v=box.querySelector("input").value.trim().toUpperCase();if(!v)return;const sc=Object.assign({ok:0,n:0},S.ans[k]||{});sc.n++;const ok=v===G[k];if(ok)sc.ok++;S.ans[k]=sc;save();const fb=box.querySelector(".fb");fb.className="fb "+(ok?"ok":"bad");fb.textContent=(ok?"✓ ¡Correcto! ":"✗ Era "+G[k]+". ")+"Aciertos: "+sc.ok+" de "+sc.n+".";if(ok)setTimeout(()=>newGrid(k,true),900);refreshProg();return;}
  if(t.dataset.pdf){makePDF(t.dataset.pdf);return;}
  if(t.dataset.print){window.print();return;}
  if(t.dataset.export){const p=S.profile;const blob=new Blob([JSON.stringify(Object.assign({app:"dasp-cuaderno",fecha:new Date().toISOString()},S),null,1)],{type:"application/json"});dl(blob,"Copia_cuaderno_"+fname({id:""}).slice(2).replace(/\.pdf$/,"")+"_"+new Date().toISOString().slice(0,10)+".json");toast("Copia descargada: súbela a 99_Copias_seguridad");return;}
  if(t.dataset.wipe){if(confirm("¿Borrar TODAS tus respuestas de este ordenador? Asegúrate antes de tener una copia en tu Drive.")){localStorage.removeItem(KEY);S={profile:{},ans:{}};route();toast("Datos borrados de este ordenador");}return;}
  if(t.id==="menu"){document.getElementById("side").classList.toggle("open");}});
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function pwdMeter(t){const v=t.value;let s=0;if(v.length>=8)s++;if(v.length>=12)s++;if(v.length>=16)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;if(/^(123|password|qwerty|abc)/i.test(v)||v.length<6)s=0;
  const pct=Math.min(100,Math.round(s/6*100));const i=t.parentElement.querySelector(".meter i");i.style.width=pct+"%";i.style.background=pct<40?"#b3261e":pct<75?"#e0a100":"#1f7a3f";
  t.parentElement.querySelector(".fb").textContent=(pct<40?"Débil":pct<75?"Mejorable":"Fuerte")+" · "+v.length+" caracteres. (No se guarda: nunca escribas aquí tu contraseña real.)";}


/* ---------- MiniPDF: generador de PDF sin dependencias ---------- */
function MiniPDF(){this.pages=[];this.cur=-1;this.sz=10;this.st="normal";this.fc=[0,0,0];this.tc=[0,0,0];this.dc=[0,0,0];this.img=null;this.addPage();}
const PK=72/25.4,PH=297,CP={"€":128,"‚":130,"„":132,"…":133,"‰":137,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"™":153};
let MCX=null;
MiniPDF.prototype={
 addPage(){this.pages.push([]);this.cur=this.pages.length-1;},
 setPage(i){this.cur=i-1;}, getNumberOfPages(){return this.pages.length;},
 setFont(f,st){this.st=st||"normal";}, setFontSize(s){this.sz=s;},
 setTextColor(r,g,b){this.tc=[r,g,b];}, setFillColor(r,g,b){this.fc=[r,g,b];}, setDrawColor(r,g,b){this.dc=[r,g,b];},
 _c(a){return a.map(v=>(v/255).toFixed(3)).join(" ");},
 _p(s){this.pages[this.cur].push(s);},
 rect(x,y,w,h){this._p(this._c(this.fc)+" rg "+(x*PK).toFixed(2)+" "+((PH-y-h)*PK).toFixed(2)+" "+(w*PK).toFixed(2)+" "+(h*PK).toFixed(2)+" re f");},
 line(x1,y1,x2,y2){this._p(this._c(this.dc)+" RG 0.6 w "+(x1*PK).toFixed(2)+" "+((PH-y1)*PK).toFixed(2)+" m "+(x2*PK).toFixed(2)+" "+((PH-y2)*PK).toFixed(2)+" l S");},
 addImage(src,t,x,y,w,h){if(!window.LOGO_JPG)return;this.img=window.LOGO_JPG;this._p("q "+(w*PK).toFixed(2)+" 0 0 "+(h*PK).toFixed(2)+" "+(x*PK).toFixed(2)+" "+((PH-y-h)*PK).toFixed(2)+" cm /Im1 Do Q");},
 _font(){return this.st==="bold"?"F2":this.st==="italic"?"F3":"F1";},
 width(s){if(!MCX)MCX=document.createElement("canvas").getContext("2d");MCX.font=(this.st==="bold"?"bold ":this.st==="italic"?"italic ":"")+"100px Helvetica, Arial, sans-serif";return MCX.measureText(s).width/100*this.sz/PK;},
 splitTextToSize(s,maxw){const out=[];String(s).split("\n").forEach(par=>{let line="";par.split(/(\s+)/).forEach(tok=>{if(!tok)return;const test=line+tok;if(this.width(test.trimEnd())<=maxw||!line.trim()){if(this.width(test.trim())>maxw&&!line.trim()){let w="";for(const ch of tok){if(this.width(w+ch)>maxw){out.push(w);w="";}w+=ch;}line=w;}else line=test;}else{out.push(line.trimEnd());line=tok.trimStart();}});out.push(line.trimEnd());});return out;},
 _esc(s){let o="";for(const ch of s){if(ch==="("||ch===")"||ch==="\\")o+="\\"+ch;else o+=ch;}return o;},
 text(s,x,y,o){if(o&&o.align==="right")x-=this.width(s);this._p("BT /"+this._font()+" "+this.sz+" Tf "+this._c(this.tc)+" rg "+(x*PK).toFixed(2)+" "+((PH-y)*PK).toFixed(2)+" Td ("+this._esc(s)+") Tj ET");},
 _bytes(s){const b=new Uint8Array(s.length);let i=0;for(const ch of s){const c=ch.charCodeAt(0);b[i++]=CP[ch]!=null?CP[ch]:(c<256?c:63);}return b.slice(0,i);},
 output(){const parts=[];let len=0;const offs=[];const add=x=>{const b=typeof x==="string"?this._bytes(x):x;parts.push(b);len+=b.length;};
  const obj=(n,body)=>{offs[n]=len;add(n+" 0 obj\n");body.forEach(add);add("\nendobj\n");};
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const np=this.pages.length,first=7;const kids=[];for(let i=0;i<np;i++)kids.push((first+2*i)+" 0 R");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+np+" >>"]);
  obj(3,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"]);
  obj(4,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"]);
  obj(5,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>"]);
  if(this.img){const bin=atob(this.img.data);const ib=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)ib[i]=bin.charCodeAt(i);
    obj(6,["<< /Type /XObject /Subtype /Image /Width "+this.img.w+" /Height "+this.img.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+ib.length+" >>\nstream\n",ib,"\nendstream"]);}
  else obj(6,["<< >>"]);
  this.pages.forEach((ops,i)=>{const pn=first+2*i,cn=pn+1;const content=this._bytes(ops.join("\n"));
    obj(pn,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >>"+(this.img?" /XObject << /Im1 6 0 R >>":"")+" >> /Contents "+cn+" 0 R >>"]);
    obj(cn,["<< /Length "+content.length+" >>\nstream\n",content,"\nendstream"]);});
  const n=first+2*np;const xref=len;let x="xref\n0 "+n+"\n0000000000 65535 f \n";for(let i=1;i<n;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(x+"trailer\n<< /Size "+n+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length;});return out;},
 save(name){dl(new Blob([this.output()],{type:"application/pdf"}),name);}
};

/* ---------- PDF ---------- */
const P1=s=>plain(s).replace(/→/g,"->").replace(/←/g,"<-").replace(/[★]/g,"*").replace(/[✓✔]/g,"OK").replace(/[✗]/g,"X").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/×/g,"x").replace(/[^\x00-\xFF€‘’“”•–—…]/g,"");
function ansText(u,n){const k=key(u,n.id),v=S.ans[k];
  if(n.type==="mc"){const opts=n.a.filter(x=>!x.startsWith("="));if(v==null)return {t:"(sin responder)"};const ok=opts[+v].startsWith("*");return {t:"ABCDEFG"[+v]+") "+opts[+v].replace(/^\*/,"")+(ok?"   [Correcta]":"   [Incorrecta]")};}
  if(n.type==="grid"){return {t:v?("Aciertos: "+v.ok+" de "+v.n):"(sin jugar)"};}
  if(n.type==="calc"){const val=v||{};const g=c=>num(val[c]!=null?val[c]:{m1:60,m2:15,np:20,tf:25}[c]);const h=(g("m1")-g("m2"))*g("np")/60;return {t:"Antes "+g("m1")+" min, ahora "+g("m2")+" min, "+g("np")+" presupuestos/mes, "+g("tf")+" €/h -> "+fmt(h,1)+" h/mes = "+fmt(h*g("tf"))+" €/mes"};}
  if(v==null||String(v).trim()==="")return {t:"(sin responder)"};
  const r=check(n,v);return {t:String(v),r};}
function makePDF(id){
  const p=S.profile;if(!p.nombre||!p.apellidos){if(!confirm("Aún no has escrito tu nombre y apellidos en «Empieza aquí». ¿Generar el PDF igualmente?"))return;}
  const us=id==="ALL"?UNITS:[UNITS.find(x=>x.id===id)];
  const doc=new MiniPDF();const W=210,M=16,CW=W-2*M;let y=M;
  const NAVY=[27,42,65];
  const need=h=>{if(y+h>285){doc.addPage();y=M;}};
  const txt=(s,o={})=>{doc.setFont("helvetica",o.b?"bold":o.i?"italic":"normal");doc.setFontSize(o.sz||10);doc.setTextColor(...(o.c||[20,20,20]));const lines=doc.splitTextToSize(P1(s),o.w||CW);lines.forEach(l=>{need(o.lh||5);doc.text(l,(o.x||M),y);y+=(o.lh||5);});};
  // header
  doc.setFillColor(...NAVY);doc.rect(0,0,W,28,"F");try{doc.addImage(window.LOGO,"PNG",M,5,18,18);}catch(e){}
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(P1(id==="ALL"?"Cuaderno completo":"Entrega · Unidad "+us[0].id),M+22,12);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(P1([[p.nombre,p.apellidos].filter(Boolean).join(" ")||"(sin nombre)",p.grupo,p.empresa?"Empresa: "+p.empresa:""].filter(Boolean).join(" · ")),M+22,18);
  doc.text(P1("Digitalización aplicada a los sistemas productivos · "+new Date().toLocaleString("es-ES")),M+22,23);y=36;
  us.forEach((u,ui)=>{if(ui>0){doc.addPage();y=M;}
    txt(u.id+" "+u.title,{b:true,sz:14,c:NAVY,lh:7});txt(u.ses+(u.ra?" · "+u.ra:"")+" · Respondido: "+Math.round(prog(u)*100)+"%",{sz:9,c:[100,100,100]});y+=2;
    const emitQ=(n)=>{
      if(n.k==="chk"){n.items.forEach(i=>{txt((S.ans[key(u,i.id)]?"[X] ":"[  ] ")+i.t,{sz:9.5});});y+=1;return;}
      if(n.k!=="q"||n.type==="pwd")return;
      txt(n.label||"",{b:true,sz:9.5});
      if(n.type==="tbl"){const cols=(n.a[0]||"").split(";");let rows=n.a[1]||"3";rows=/^\d+$/.test(rows)?Array.from({length:+rows},(_,i)=>String(i+1)):rows.split(";");const v=S.ans[key(u,n.id)]||{};
        rows.forEach((r,ri)=>{const parts=cols.map((c,ci)=>c+": "+((v[ri+"_"+ci]||"").trim()||"-"));txt("• "+r+" -> "+parts.join(" | "),{sz:9.5,x:M+3,w:CW-3});});y+=1.5;return;}
      const a=ansText(u,n);txt(a.t,{sz:10,x:M+3,w:CW-3,c:[30,60,140]});if(a.r)txt(a.r.ok?"Autocomprobación: correcto":"Autocomprobación: revisar",{sz:8.5,x:M+3,c:a.r.ok?[31,122,63]:[179,38,30]});y+=1.5;};
    const go=(arr,inAct)=>arr.forEach(n=>{
      if(n.k==="act"){need(14);y+=3;doc.setDrawColor(220,224,232);doc.line(M,y-5.5,W-M,y-5.5);txt("Actividad "+n.n+". "+n.t,{b:true,sz:11,c:NAVY,lh:6});go(n.c,true);y+=1;}
      else if(n.k==="ex"){go(n.c,inAct);}
      else if(n.k==="ses"){y+=2;txt(n.t.toUpperCase(),{b:true,sz:9,c:[120,120,120]});}
      else if(n.k==="h2"&&/construye/i.test(n.t)){y+=1;txt(n.t,{b:true,sz:11,c:NAVY,lh:6});}
      else emitQ(n);});
    go(u.ast,false);
  });
  const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(140,140,140);doc.text(P1("Página "+i+" de "+pages),W-M,292,{align:"right"});}
  const name=id==="ALL"?"Cuaderno_completo_"+fname({id:""}).slice(2):fname(us[0]);
  doc.save(name);toast("PDF descargado: súbelo a 00_Entregas_cuaderno");
}

/* ---------- boot ---------- */
window.addEventListener("hashchange",route);
route();
window.__DASP={S:()=>S,UNITS,check,makePDF,MiniPDF};
})();
